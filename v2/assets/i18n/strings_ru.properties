rules.title=Правила и карты
rules.goal.title=ЦЕЛЬ
rules.goal.body=Выложи в свой SPACE все пять букв: F, I, R, S, T. Порядок неважен. Пять одинаковых букв — тоже победа.
rules.turn.title=ХОД
rules.turn.body=Возьми карту из колоды. Выложи одну карту из руки в свой SPACE и сразу выполни её эффект. Тот, кто ходит первым, в свой первый ход карту не берёт.
rules.cards.title=КАРТЫ
rules.card.F=FORBID — назови любую букву. Если противник попробует её сыграть, карта уйдёт в его сброс, а эффект не сработает. Запрет действует, пока карта F лежит в твоём SPACE: на ней виден флаг.
rules.card.I=INCREASE — возьми ещё одну карту из колоды.
rules.card.R=RECOVER — забери одну карту из своего сброса обратно в руку.
rules.card.S=STEAL — отправь любую карту из SPACE противника в его сброс. Если это была его последняя F, его запрет снимается.
rules.card.T=TRAP — в начале следующего хода противник сбросит одну карту.
rules.limits.title=ВАЖНО
rules.limits.body=В руке не больше 7 карт — лишние сразу уходят в сброс. Если колода кончилась и брать нечего, ты проиграл. Свою запрещённую букву ты не видишь: на флаге противника вместо неё знак вопроса.

