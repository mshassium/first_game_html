<style>

#mat{position:absolute;left:0;top:0;pointer-events:none}
#fx{position:absolute;left:0;top:0;width:1536px;height:864px;pointer-events:none}

#menu .items div{cursor:pointer}#menu .items div:hover{color:#7a4a1e}

#cap{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(20,15,10,.84);border:1px solid var(--rule);
 padding:9px 18px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;max-width:60vw;text-align:center;z-index:70;pointer-events:none}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.acts button:hover{border-color:#705a34}.acts button:disabled{opacity:.45;cursor:default}

#panel.min{width:auto}#panel.min>*:not(h1){display:none}

<div id="stage"><div id="scene">
 <img id="plate" alt="">

<div id="panel"><h1>E8 · Светлый клуб <button id="minb">–</button></h1>
 <p class="sub">Новый мир по D5b. Стол — картина, разметка коврика рисуется движком, предметы вырезаны из отдельных листов.</p>
 <h2>Сцена</h2>
 <div class="acts"><button class="big" data-act="all">▶ Сыграть ход</button>
  <button data-act="menu">Меню · блокнот</button><button data-act="deal">Раздача</button>

 <label class="chk"><input type="checkbox" id="cp" checked> подписи</label>
 <label class="chk"><input type="checkbox" id="slow"> замедление ×2</label>

<script>
// ═══ 1. Плоскость коврика ═════════════════════════════════════════════════════
// Координаты (u,v) — доли коврика: (0,0) — его левый верхний угол, (1,1) — правый нижний.
// Гомография построена по четырём углам коврика на самой картине, поэтому разметка,
// карты и предметы ложатся в перспективу стола автоматически.
const CANVAS_W=1536, CANVAS_H=864;
const PLATE='out/M13_gpt-5.4-image-2_1.png';        // стол с пустым ковриком
const ORIGINAL='out/M9_gpt-5.4-image-2_3.png';      // тот же кадр с нарисованной разметкой — для сверки
const MAT_QUAD=[[348,233],[1179,219],[1303,599],[297,630]];
function unitTo(q){const [p0,p1,p2,p3]=q;
 const dx1=p1[0]-p2[0],dx2=p3[0]-p2[0],dx3=p0[0]-p1[0]+p2[0]-p3[0];
 const dy1=p1[1]-p2[1],dy2=p3[1]-p2[1],dy3=p0[1]-p1[1]+p2[1]-p3[1];
 const den=dx1*dy2-dx2*dy1, g=(dx3*dy2-dx2*dy3)/den, h=(dx1*dy3-dx3*dy1)/den;
 return [p1[0]-p0[0]+g*p1[0], p3[0]-p0[0]+h*p3[0], p0[0],
         p1[1]-p0[1]+g*p1[1], p3[1]-p0[1]+h*p3[1], p0[1], g, h, 1]}
function inv3(m){const [a,b,c,d,e,f,g,h,i]=m;
 const A=e*i-f*h,B=f*g-d*i,C=d*h-e*g,det=a*A+b*B+c*C;
 return [A/det,(c*h-b*i)/det,(b*f-c*e)/det,B/det,(a*i-c*g)/det,(c*d-a*f)/det,C/det,(b*g-a*h)/det,(a*e-b*d)/det]}
function mul3(m,n){const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)
 r[i*3+j]=m[i*3]*n[j]+m[i*3+1]*n[3+j]+m[i*3+2]*n[6+j];return r}
function mat3d(m){const k=1/m[8];
 return `matrix3d(${m[0]*k},${m[3]*k},0,${m[6]*k}, ${m[1]*k},${m[4]*k},0,${m[7]*k}, 0,0,1,0, ${m[2]*k},${m[5]*k},0,1)`}
const HM=unitTo(MAT_QUAD), HINV=inv3(HM);
function P(u,v){const d=HM[6]*u+HM[7]*v+HM[8];
 return [(HM[0]*u+HM[1]*v+HM[2])/d,(HM[3]*u+HM[4]*v+HM[5])/d]}
function planeOf(x,y){const d=HINV[6]*x+HINV[7]*y+HINV[8];
 return [(HINV[0]*x+HINV[1]*y+HINV[2])/d,(HINV[3]*x+HINV[4]*y+HINV[5])/d]}
function quad(u,v,w,h,rot=0){const c=Math.cos(rot),s=Math.sin(rot);
 return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>P(u+x*c-y*s,v+x*s+y*c))}
function liftQ(q,k){const cx=(q[0][0]+q[2][0])/2, cy=(q[0][1]+q[2][1])/2, s=1+k*.0016;
 return q.map(([x,y])=>[cx+(x-cx)*s, cy+(y-cy)*s-k])}
// ═══ 2. Раскладка стола ═══════════════════════════════════════════════════════
const CARD_W=0.105, CARD_H=0.355;                   // карта в долях коврика
const COLS=[0.22,0.36,0.50,0.64,0.78];              // пять слотов в ряду
const ROWS=[0.275,0.725];                            // ряд противника / мой ряд
const SOCK_X=0.09, SOCK_Y={0:[0.20,0.36], 1:[0.64,0.80]};
const HAND={v:1.30, u:0.50, step:0.145, tilt:0.055};
const DECK={0:[1.1124,0.40], 1:[1.0692,0.8746]};     // колоды нарисованы на картине
const TRAY=[1.2425,0.0643];                          // лоток сброса — тоже нарисован
const HUD_AT=[792,592,-6];                           // блокнот на столе (пиксели картины): туда пишется счёт
const LETTERS=['F','I','R','S','T'];
const COLOR={F:'#2f6ea8',I:'#3f7a3a',R:'#c07a1e',S:'#a8322c',T:'#5a3f9e'};
const A={F:'assets/F.png',I:'assets/I.png',R:'assets/R.png',S:'assets/S.png',T:'assets/T.png',
 BACK:'assets/BACK.png',NOTEPAD:'assets/NOTEPAD.png',PUNCH:'assets/PUNCH.png',
 TOK_F:'assets/TOK_F.png',TOK_I:'assets/TOK_I.png',TOK_R:'assets/TOK_R.png',
 TOK_S:'assets/TOK_S.png',TOK_T:'assets/TOK_T.png'};
const TOKEN_SPOT={F:'socket', I:'deck', R:'tray', S:'oppCard', T:'myCard'};
function slot(col,row){return [COLS[Math.min(col,4)], ROWS[row]]}
// ═══ 3. Движок ════════════════════════════════════════════════════════════════
const E={lin:t=>t,sineOut:t=>Math.sin(t*Math.PI/2),pow2In:t=>t*t,pow2Out:t=>1-(1-t)*(1-t),
 pow3In:t=>t*t*t,swingOut:t=>{t-=1;return t*t*(3*t+2)+1}};
const $=id=>document.getElementById(id), speed=()=>$('slow').checked?2:1;
const tweens=new Set();
function tween(d,fn,e='lin',done){const t0=performance.now(),tw={};
 tw.step=now=>{const p=Math.min(1,(now-t0)/(d*1000*speed()));fn((E[e]||E.lin)(p),p);
  if(p>=1){tweens.delete(tw);done&&done()}};tweens.add(tw)}
const tw=(d,f,e)=>new Promise(r=>tween(d,f,e,r));
const wait=s=>new Promise(r=>setTimeout(r,s*1000*speed()));
const scene=$('scene'),table=$('table'),fx=$('fx'),ctx=fx.getContext('2d');
let jolt=0, busy=false, turn=0;
function fit(){const k=Math.min(innerWidth/CANVAS_W,innerHeight/CANVAS_H);
 scene.style.transform=`translate(${(innerWidth-CANVAS_W*k)/2}px,${(innerHeight-CANVAS_H*k)/2}px) scale(${k})`}
addEventListener('resize',fit);fit();
fx.width=CANVAS_W*1.5;fx.height=CANVAS_H*1.5;ctx.setTransform(1.5,0,0,1.5,0,0);
$('plate').src=PLATE;$('orig').src=ORIGINAL;
// ═══ 4. Разметку коврика рисует движок, а не картина ══════════════════════════
function drawMat(){const svg=$('mat');svg.innerHTML='';
 const ns='http://www.w3.org/2000/svg', line='rgba(150,196,232,.40)';
 for(let r=0;r<2;r++)for(let c=0;c<5;c++){
  const [u,v]=slot(c,r), q=quad(u,v,CARD_W,CARD_H);
  const p=document.createElementNS(ns,'polygon');
  p.setAttribute('points',q.map(pt=>pt.join(',')).join(' '));
  p.setAttribute('fill','none');p.setAttribute('stroke',line);p.setAttribute('stroke-width','2.4');
  p.setAttribute('stroke-linejoin','round');svg.appendChild(p)}
 for(const s of [0,1])for(const v of SOCK_Y[s]){
  const c=P(SOCK_X,v), r1=Math.abs(P(SOCK_X+0.030,v)[0]-c[0]), r2=r1*0.62;
  const e=document.createElementNS(ns,'ellipse');
  e.setAttribute('cx',c[0]);e.setAttribute('cy',c[1]);e.setAttribute('rx',r1);e.setAttribute('ry',r2);
  e.setAttribute('fill','none');e.setAttribute('stroke',line);e.setAttribute('stroke-width','2.4');svg.appendChild(e)}}
// ═══ 5. Карты ═════════════════════════════════════════════════════════════════
const cards={};
function img(src,cls,w,h){const el=new Image();el.src=src;el.className=cls;el.alt='';
 el.style.width=w+'px';if(h)el.style.height=h+'px';table.appendChild(el);return el}
function mkCard(letter){
 const el=img(A[letter],'spr hit',234,380), back=img(A.BACK,'spr',227,378);
 const c={letter,el,back,u:0,v:0,rot:0,k:1,liftK:0,z:20,face:true,where:'deck',hidden:true,phase:Math.random()*6.28,
  srcQ:[[0,0],[234,0],[234,380],[0,380]], backQ:[[0,0],[227,0],[227,378],[0,378]]};
 cards[letter]=c;return c}
function drawCard(c,bob=0){
 const q=liftQ(quad(c.u,c.v+bob,CARD_W*c.k,CARD_H*c.k,c.rot),c.liftK);
 c.el.style.transform=mat3d(mul3(unitTo(q),inv3(unitTo(c.srcQ))));
 c.back.style.transform=mat3d(mul3(unitTo(q),inv3(unitTo(c.backQ))));
 const sh=`drop-shadow(${(2+c.liftK*.10).toFixed(1)}px ${(4+c.liftK*.16).toFixed(1)}px ${(4+c.liftK*.12).toFixed(1)}px rgba(0,0,0,${(.42+Math.min(.25,c.liftK/160)).toFixed(2)}))`;
 c.el.style.filter=(c.dim?'brightness(.88) saturate(.92) ':'')+sh;c.back.style.filter=sh;
 c.el.style.zIndex=c.z;c.back.style.zIndex=c.z;
 c.el.style.opacity=c.hidden?0:(c.face?1:0);
 c.back.style.opacity=c.hidden?0:(c.face?0:1)}
function setCard(c,u,v,rot=c.rot,k=c.k){c.u=u;c.v=v;c.rot=rot;c.k=k;drawCard(c)}
// ═══ 6. Предметы ══════════════════════════════════════════════════════════════
const objs={};
function mkObj(key,src,wu,plane,opts={}){const el=img(src,'obj'+(opts.hit?' hit':''),10);
 const o={key,el,wu,u:plane[0],v:plane[1],rot:0,liftPx:0,scale:1,z:opts.z||30,alpha:1};
 if(opts.label!==undefined){const l=document.createElement('div');l.className='lbl';l.textContent=opts.label;
  table.appendChild(l);o.lbl=l}
 objs[key]=o;return o}
function drawObj(o){const [x,y]=P(o.u,o.v);
 const w=Math.abs(P(o.u+o.wu/2,o.v)[0]-P(o.u-o.wu/2,o.v)[0])*o.scale;
 const h=o.el.naturalWidth?w*o.el.naturalHeight/o.el.naturalWidth:w;
 o.el.style.width=w+'px';o.el.style.height=h+'px';
 o.el.style.transform=`translate(${x-w/2}px,${y-h/2-o.liftPx}px) rotate(${o.rot}deg)`;
 o.el.style.zIndex=o.z;o.el.style.opacity=o.alpha;
 o.el.style.filter=`drop-shadow(${(1+o.liftPx*.09).toFixed(1)}px ${(3+o.liftPx*.14).toFixed(1)}px ${(3+o.liftPx*.10).toFixed(1)}px rgba(0,0,0,.45))`;
 if(o.lbl){o.lbl.style.transform=`translate(${x-45}px,${y-h*.30-o.liftPx}px) scale(${(w/90).toFixed(3)})`;
  o.lbl.style.setProperty('--fs','38px');o.lbl.style.opacity=o.alpha;o.lbl.style.zIndex=String(o.z+1)}}
LETTERS.forEach(mkCard);
const tokens={};
for(const L of LETTERS){tokens[L]=mkObj('tok'+L,A['TOK_'+L],0.072,[SOCK_X,SOCK_Y[0][1]],{z:64});tokens[L].alpha=0}
const marker=mkObj('marker',A.PUNCH,0.062,[SOCK_X,SOCK_Y[0][0]],{z:34});   // маркер активного игрока
const punches=LETTERS.map((L,i)=>{const o=mkObj('punch'+L,A.PUNCH,0.075,[0.22+i*0.14,1.12],{z:50,label:L,hit:true});
 o.letter=L;o.alpha=0;o.lbl.style.color=COLOR[L];return o});
// ═══ 7. Пыль и конфетти ═══════════════════════════════════════════════════════
const parts=[];let last=performance.now();
function dust(x,y,n,spread=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(36+Math.random()*80)*spread;
 parts.push({x,y,vx:Math.cos(a)*sp*.6,vy:-Math.abs(Math.sin(a))*sp*.5-16,life:.45+Math.random()*.35,t:0,r:2+Math.random()*3.4,kind:'dust'})}}
function confetti(x,y,n){const cols=['#e04a3a','#3f9a5e','#e39a2a','#7fb2e6','#8a5fc9','#f2dfa6'];
 for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.7,sp=200+Math.random()*300;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.5+Math.random()*.9,t:0,r:3+Math.random()*4,
   kind:'paper',color:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*10})}}
function particles(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000)/speed();last=now;
 ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}
  const k=1-p.t/p.life;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.kind==='paper'){p.vy+=340*dt;p.vx*=.985;p.rot+=p.vr*dt;
   ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,k*3);ctx.fillStyle=p.color;
   ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore();continue}
  p.vy+=54*dt;p.vx*=.98;ctx.globalAlpha=k*.4;ctx.fillStyle='#d8c8a8';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r*(2-k),0,6.3);ctx.fill()}
 ctx.globalAlpha=1}
function frame(now){for(const t of [...tweens])t.step(now);
 const t=now/1000;
 for(const l of LETTERS){const c=cards[l];
  drawCard(c, c.where==='hand'&&!c.busy?Math.sin(t*2.1+c.phase)*.004:0)}
 for(const k in objs)drawObj(objs[k]);
 if(jolt>0){scene.style.marginLeft=((Math.random()*2-1)*jolt)+'px';scene.style.marginTop=((Math.random()*2-1)*jolt)+'px';
  jolt*=.86;if(jolt<.25){jolt=0;scene.style.marginLeft=scene.style.marginTop=''}}
 particles();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
// ═══ 8. Подписи и счёт в блокноте ═════════════════════════════════════════════
const cap=$('cap');let capT=0;
function say(text,sec=2.8){if(!$('cp').checked)return;cap.textContent=text;cap.classList.add('on');
 clearTimeout(capT);capT=setTimeout(()=>cap.classList.remove('on'),sec*1000*speed())}
const state={me:[],opp:[],discard:[],forbid:null};
function layFlat(el,u,v,wpx,hpx,rot=0,z=28){          // положить DOM-прямоугольник в плоскость коврика
 const du=Math.hypot(...P(u+.5,v).map((c,i)=>c-P(u-.5,v)[i])), dv=Math.hypot(...P(u,v+.5).map((c,i)=>c-P(u,v-.5)[i]));
 const q=quad(u,v,wpx/du,hpx/dv,rot), src=[[0,0],[wpx,0],[wpx,hpx],[0,hpx]];
 el.style.width=wpx+'px';el.style.height=hpx+'px';el.style.transformOrigin='0 0';el.style.zIndex=String(z);
 el.style.transform=mat3d(mul3(unitTo(q),inv3(unitTo(src))))}
function drawHud(){const hud=$('hud');
 const row=(who,arr)=>`<div class="row"><b>${who}</b>${LETTERS.map(l=>arr.includes(l)?l:`<s>${l}</s>`).join(' ')}</div>`;
 hud.innerHTML='';}
// ═══ 9. Грамматика движения ═══════════════════════════════════════════════════
function handLayout(){const hs=LETTERS.map(l=>cards[l]).filter(c=>c.where==='hand');
 const vh=HAND.v+(turn===1?0:0.045);                   // в чужой ход рука приспущена и притушена
 hs.forEach((c,i)=>{const n=hs.length,u=HAND.u-((n-1)/2)*HAND.step+i*HAND.step,rot=(i-(n-1)/2)*HAND.tilt;
  c.dim=turn!==1;c.z=25+i;const f={u:c.u,v:c.v,rot:c.rot,k:c.k};
  tween(.28,p=>setCard(c,f.u+(u-f.u)*p,f.v+(vh-f.v)*p,f.rot+(rot-f.rot)*p,f.k+(1-f.k)*p),'swingOut')})}
async function playCard(c,col,row){                    // карта едет по прямой и ложится в слот
 c.busy=true;c.z=60;const [u,v]=slot(col,row),f={u:c.u,v:c.v,rot:c.rot,k:c.k};
 await tw(.44,(e,l)=>{c.liftK=Math.sin(l*Math.PI)*34;
  setCard(c,f.u+(u-f.u)*e,f.v+(v-f.v)*e,f.rot*(1-e),f.k+(1-f.k)*e)},'swingOut');
 c.liftK=0;c.where='board';c.z=20;c.dim=false;setCard(c,u,v,0,1);
 const [x,y]=P(u,v);jolt=Math.max(jolt,4);dust(x,y+26,10);
 await tw(.22,(e,l)=>{c.liftK=5*Math.sin(l*Math.PI);drawCard(c)},'pow2Out');c.liftK=0;c.busy=false}
async function dropObj(o,u,v,h=120){                   // жетон падает на своё место
 o.u=u;o.v=v;o.liftPx=h;o.alpha=0;o.scale=1.2;
 await tw(.34,(e,l)=>{o.liftPx=h*(1-e);o.alpha=Math.min(1,l*4);o.scale=1.2-.2*e},'pow2In');
 o.liftPx=0;o.scale=1;const [x,y]=P(u,v);jolt=Math.max(jolt,4);dust(x,y+8,8);
 await tw(.18,(e,l)=>{o.scale=1+.07*Math.sin(l*Math.PI)},'lin');o.scale=1}
async function moveObj(o,u,v,dur=.45,h=70){const f={u:o.u,v:o.v};
 await tw(dur,(e,l)=>{o.u=f.u+(u-f.u)*e;o.v=f.v+(v-f.v)*e;o.liftPx=Math.sin(l*Math.PI)*h},'sineOut');o.liftPx=0}
// ═══ 10. Шаги партии ══════════════════════════════════════════════════════════
async function stepTurn(to=1-turn){                    // маркер переезжает в гнездо активной стороны
 turn=to;say(to?'Мой ход':'Ход противника');
 await moveObj(marker,SOCK_X,SOCK_Y[to][0],.5,54);
 jolt=Math.max(jolt,2);drawHud();handLayout()}
async function stepDeal(n=4){say('Раздача: карты приходят из колоды рубашкой вверх');
 const hs=LETTERS.filter(l=>cards[l].where==='deck'&&l!=='R').slice(0,n);
 for(const l of hs){const c=cards[l];c.hidden=false;c.face=false;c.where='flying';c.z=55;
  setCard(c,DECK[1][0],DECK[1][1],0,.92);let flipped=false;
  await tw(.44,(e,l2)=>{c.liftK=Math.sin(l2*Math.PI)*54;if(l2>.55&&!flipped){flipped=true;c.face=true}
   setCard(c,DECK[1][0]+(HAND.u-DECK[1][0])*e,DECK[1][1]+(HAND.v-DECK[1][1])*e,0,.92+.08*e)},'swingOut');
  c.liftK=0;c.face=true;c.where='hand';drawHud();handLayout();await wait(.12)}}
async function stepPlay(letter){
 const c=letter&&cards[letter].where==='hand'?cards[letter]:LETTERS.map(l=>cards[l]).find(x=>x.where==='hand');
 if(!c){say('Рука пуста — «Заново»');return}
 say('Розыгрыш: карта ложится в слот');
 c.where='flying';handLayout();await playCard(c,state.me.length,1);
 state.me.push(c.letter);drawHud();return c}
async function stepOppPlay(){const c=cards.R;
 if(c.where==='board')return;
 say('Противник кладёт карту в свой ряд');
 c.hidden=false;c.face=false;c.where='flying';c.z=55;setCard(c,DECK[0][0],DECK[0][1],0,.92);
 let flipped=false;const [u,v]=slot(state.opp.length,0);
 await tw(.5,(e,l)=>{c.liftK=Math.sin(l*Math.PI)*40;if(l>.5&&!flipped){flipped=true;c.face=true}
  setCard(c,DECK[0][0]+(u-DECK[0][0])*e,DECK[0][1]+(v-DECK[0][1])*e,0,.92+.08*e)},'swingOut');
 c.liftK=0;c.where='board';c.z=20;setCard(c,u,v,0,1);
 state.opp.push(c.letter);drawHud();jolt=Math.max(jolt,4);dust(...P(u,v),8)}
function tokenSpot(L){                                 // у каждого состояния своё место (E4)
 switch(TOKEN_SPOT[L]){
  case 'socket': return [SOCK_X,SOCK_Y[0][1]];
  case 'deck':   return [DECK[1][0]-0.07,DECK[1][1]];
  case 'tray':   return [TRAY[0]-0.07,TRAY[1]+0.10];
  case 'oppCard':{const [u,v]=slot(Math.max(0,state.opp.length-1),0);return [u+0.038,v+0.13]}
  default:       {const [u,v]=slot(Math.max(0,state.me.length-1),1);return [u+0.038,v+0.13]}}}
const TOKEN_SAY={F:'Запрет: жетон-замок ложится в гнездо противника',
 I:'Добор: жетон-росток ложится у моей колоды', R:'Возврат: жетон-перо ложится у лотка сброса',
 S:'Кража: жетон-рука садится на карту противника', T:'Ловушка: жетон-капкан садится на мою карту'};
async function stepEffect(L){const o=tokens[L];say(TOKEN_SAY[L]);o.alpha=0;await dropObj(o,...tokenSpot(L))}
async function stepAllTokens(){
 if(!state.opp.length)await stepOppPlay();
 if(!state.me.length){if(!LETTERS.some(l=>cards[l].where==='hand'))await stepDeal(3);await stepPlay()}
 say('Пять состояний — пять жетонов, у каждого своё место',3.5);
 for(const L of LETTERS){await stepEffect(L);await wait(.45)}
 await wait(1.1);
 await Promise.all(LETTERS.map(L=>tw(.3,e=>{tokens[L].alpha=1-e;tokens[L].liftPx=30*e},'pow2In')));
 LETTERS.forEach(L=>{tokens[L].alpha=0;tokens[L].liftPx=0})}
async function stepPick(letter='T'){                   // выбор буквы — жетоны-выбивки на столе
 say('Эффект F: жетоны-выбивки ложатся перед вами — выберите букву');
 punches.forEach((o,i)=>{o.u=0.22+i*0.14;o.v=1.12;o.liftPx=0;o.alpha=0;o.scale=1.15;
  tween(.3+i*.05,e=>{o.alpha=e;o.scale=1.15-.15*e;o.liftPx=34*(1-e)},'pow2Out')});
 await wait(1.0);
 const pick=punches.find(o=>o.letter===letter);
 say('Выбрана буква '+letter+' — жетон уходит в гнездо запрета');
 await Promise.all(punches.filter(o=>o!==pick).map(o=>tw(.3,e=>{o.alpha=1-e;o.liftPx=22*e},'pow2In')));
 punches.forEach(o=>{if(o!==pick){o.alpha=0;o.liftPx=0}});
 await moveObj(pick,SOCK_X,SOCK_Y[0][1],.5,80);
 state.forbid=letter;drawHud()}
function trayPlace(i){const j=Math.min(i,4);          // растущая стопка: виден край каждой предыдущей
 return [TRAY[0]-0.055+j*0.028, TRAY[1]-0.03+j*0.055, 0.06*(j%2?1:-1)-0.02, .62]}
async function toTray(c){
 c.busy=true;c.z=45+state.discard.length;const f={u:c.u,v:c.v,rot:c.rot,k:c.k};
 const [tu,tv,trot,tk]=trayPlace(state.discard.length);
 await tw(.5,(e,l)=>{c.liftK=Math.sin(l*Math.PI)*24;
  setCard(c,f.u+(tu-f.u)*e,f.v+(tv-f.v)*e,f.rot+(trot-f.rot)*e,f.k+(tk-f.k)*e)},'pow2In');
 c.liftK=0;c.where='tray';c.busy=false;state.discard.push(c.letter);drawHud();
 dust(...P(tu,tv),5);jolt=Math.max(jolt,2)}
async function stepDiscard(){const c=LETTERS.map(l=>cards[l]).find(x=>x.where==='board'&&state.me.includes(x.letter));
 if(!c){say('Нечего сбрасывать');return}
 say('Сброс: карта уезжает в лоток лицом вверх');
 state.me=state.me.filter(l=>l!==c.letter);await toTray(c)}
// меню и итог партии — записи в блокноте на том же столе
const menu=$('menu');
function menuLayout(){layFlat(menu,0.48,0.52,660,415,-0.015,90)}
function openNote(lines,clickable=true){menuLayout();
 menu.querySelector('img').src=A.NOTEPAD;
 menu.querySelector('.items').innerHTML=lines.map(t=>`<div>${t}</div>`).join('');
 if(clickable)menu.querySelectorAll('.items div').forEach(d=>d.onclick=()=>{d.classList.add('pick');setTimeout(closeNote,700)});
 menu.classList.add('on')}
function closeNote(){menu.classList.remove('on')}
async function stepMenu(open=true){
 if(open){say('Меню — не окно, а блокнот на том же столе');openNote(['Новая партия','Правила','Выйти'])}
 else closeNote()}
async function stepWin(){say('Победа: собраны все пять букв');
 state.me=[...LETTERS];drawHud();
 confetti(...P(0.35,0.9),110);confetti(...P(0.68,0.9),110);jolt=Math.max(jolt,6);
 openNote(['Победа!','F I R S T','ещё партию?']);
 await wait(1.2);confetti(...P(0.5,0.6),90)}
async function stepLose(){say('Поражение: колода кончилась');
 openNote(['Колода пуста','партия проиграна','ещё раз?']);await wait(.4)}
// ═══ 11. Сцена целиком ════════════════════════════════════════════════════════
async function sceneAll(){if(busy)return;busy=true;setBusy(true);
 await reset();await wait(.4);
 await stepMenu(true);await wait(1.3);
 menu.querySelector('.items div').classList.add('pick');await wait(.6);
 closeNote();await wait(.3);
 await stepDeal(4);await wait(.5);
 await stepTurn(1);await wait(.4);
 await stepPlay('F');await wait(.5);
 await stepPick('T');await wait(.7);
 await stepTurn(0);await wait(.4);
 await stepOppPlay();await wait(.5);
 await stepEffect('T');await wait(.9);
 await stepTurn(1);await wait(.4);
 await stepPlay('I');await wait(.5);
 await stepDiscard();await wait(.5);
 say('Стол — картина, разметка от движка, предметы вырезаны из отдельных листов',5);
 busy=false;setBusy(false)}
function setBusy(b){document.querySelectorAll('.acts button').forEach(x=>x.disabled=b)}
// ═══ 12. Исходное состояние и управление ══════════════════════════════════════
async function reset(){
 state.me=[];state.opp=[];state.discard=[];state.forbid=null;turn=0;
 for(const l of LETTERS){const c=cards[l];c.where='deck';c.face=true;c.busy=false;c.liftK=0;c.z=20;c.hidden=true;c.dim=false;
  setCard(c,DECK[1][0],DECK[1][1],0,.92)}
 punches.forEach(o=>{o.alpha=0;o.liftPx=0});
 LETTERS.forEach(L=>{tokens[L].alpha=0;tokens[L].liftPx=0});
 marker.u=SOCK_X;marker.v=SOCK_Y[0][0];marker.alpha=1;marker.liftPx=0;
 closeNote();drawMat();drawHud()}
const ACT={all:sceneAll,menu:()=>stepMenu(!menu.classList.contains('on')),deal:()=>stepDeal(4),play:()=>stepPlay(),
 pick:()=>stepPick('T'),tokens:stepAllTokens,discard:stepDiscard,turn:()=>stepTurn(),
 win:stepWin,lose:stepLose,reset};
document.querySelectorAll('.acts button').forEach(b=>b.onclick=async()=>{
 const a=b.dataset.act;if(a==='all')return ACT.all();
 if(busy)return;setBusy(true);await ACT[a]();setBusy(false)});
$('ab').onchange=e=>{$('orig').style.opacity=e.target.checked?1:0;
 if(e.target.checked)say('Поверх — исходный кадр с нарисованной разметкой',3)};
$('gr').onchange=e=>$('mat').style.opacity=e.target.checked?1:0;
$('minb').onclick=()=>$('panel').classList.toggle('min');
table.addEventListener('click',e=>{if(busy)return;
 const el=e.target.closest('img');if(!el)return;
 const c=Object.values(cards).find(x=>x.el===el);
 if(c&&c.where==='hand'){c.where='flying';handLayout();
  playCard(c,state.me.length,1).then(()=>{state.me.push(c.letter);drawHud()});return}
 const p=punches.find(o=>o.el===el);if(p&&p.alpha>.5)stepPick(p.letter)});
reset().then(()=>say('Светлый клуб: новый мир, новые ассеты. Нажмите «Сыграть ход».',5));
</script>
