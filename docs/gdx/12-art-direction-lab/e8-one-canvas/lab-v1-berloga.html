<style>
:root{--bg:#0d0b08;--panel:rgba(30,25,19,.92);--ink:#eadfcd;--muted:#a3957f;--gold:#d3a54a;--rule:#3a3024;--mono:ui-monospace,Menlo,monospace;--la:.16}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;height:100vh}
#stage{position:absolute;inset:0;overflow:hidden}
#scene{position:absolute;left:0;top:0;width:1536px;height:864px;transform-origin:0 0}
#plate,#orig{position:absolute;left:0;top:0;width:1536px;height:864px;display:block}
#orig{opacity:0;transition:opacity .3s}
#lamp{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
 background:radial-gradient(ellipse 40% 50% at 9% 5%,rgba(255,198,112,var(--la)),rgba(255,190,100,0) 72%)}

.spr{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.obj{position:absolute;left:0;top:0;will-change:transform}

.hit{cursor:pointer}
.shadow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(6px);
 background:radial-gradient(ellipse at center,rgba(0,0,0,.7),rgba(0,0,0,.34) 46%,rgba(0,0,0,0) 72%)}
.lbl{position:absolute;left:0;top:0;transform-origin:50% 50%;pointer-events:none;width:80px;text-align:center;
 font:700 var(--fs,26px)/1 "Noteworthy","Bradley Hand","Marker Felt",cursive;color:#2f2519}
#hud{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;width:170px;
 font:600 25px/1.25 "Noteworthy","Bradley Hand","Marker Felt",cursive;color:#241a10;opacity:.95;
 text-shadow:0 1px 0 rgba(255,240,210,.35)}
#hud .row{display:flex;gap:5px;align-items:baseline;letter-spacing:.03em}
#hud .row b{font-weight:700;min-width:30px;color:#3a2a18}
#hud s{opacity:.28}
#menu{position:absolute;left:0;top:0;opacity:0;pointer-events:none;transition:opacity .35s;
 filter:drop-shadow(0 16px 22px rgba(0,0,0,.6))}
#menu img{display:block;width:100%;height:auto}
#menu .items{position:absolute;left:9%;top:19%;width:38%;
 font:700 32px/2.1 "Noteworthy","Bradley Hand","Marker Felt",cursive;color:#3a2c1c}
#menu .items div{cursor:pointer}
#menu .items div:hover{color:#7a4a1e}
#menu .items div.pick::after{content:" ✓";color:#7a4a1e}
#menu.on{opacity:1;pointer-events:auto}
#seams{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s}
#seams.on{opacity:1}
#seams div{position:absolute;border:1.5px dashed rgba(255,214,140,.7);border-radius:3px}
#cap{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(16,12,9,.82);border:1px solid var(--rule);
 padding:9px 18px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;max-width:62vw;text-align:center;z-index:70;pointer-events:none}
#cap.on{opacity:1}
#panel{position:absolute;top:12px;right:12px;width:238px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);z-index:80}
#panel h1{font:400 18px Georgia,serif;margin:0 0 2px}#panel h1 button{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
#panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
#panel h2{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{background:#2a231b;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 6px;font:13px inherit;cursor:pointer;text-align:left}
.acts button:hover{border-color:#6a5636}.acts button:disabled{opacity:.45;cursor:default}
.acts button.big{grid-column:1/3;background:#332a1c;border-color:var(--gold);color:var(--gold)}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-top:7px;cursor:pointer}
#panel.min{width:auto}#panel.min>*:not(h1){display:none}

<div id="panel"><h1>E8 · Единый холст <button id="minb">–</button></h1>
 <p class="sub">Раунд 6. Карты режутся по телу и не дают артефактов, жетон садится на угол карты, сброс — растущая стопка, маркер хода не вращается.</p>
 <h2>Сцена</h2>
 <div class="acts"><button class="big" data-act="all">▶ Сыграть ход</button>
  <button data-act="menu">Меню · блокнот</button><button data-act="deal">Раздача</button>
  <button data-act="play">Розыгрыш</button><button data-act="pick">Выбор буквы</button>
  <button data-act="tokens">Пять жетонов</button><button data-act="discard">Сброс</button>
  <button data-act="turn">Передать ход</button><button data-act="win">Победа</button>
  <button data-act="lose">Поражение</button><button data-act="reset">Заново</button>
  <button class="big" data-act="orient">⟳ Портрет / ландшафт</button></div>
 <h2>Проверка</h2>
 <label class="chk"><input type="checkbox" id="ab"> оригинал холста поверх</label>
 <label class="chk"><input type="checkbox" id="sm"> швы: что вырезано</label>
 <label class="chk"><input type="checkbox" id="cp" checked> подписи</label>
 <label class="chk"><input type="checkbox" id="slow"> замедление ×2</label>

<script>
// ═══ 1. Плоскость стола ═══════════════════════════════════════════════════════
// Гомография (u,v) → пиксели картины: u — колонка слота 0…4, v — ряд (0 — противник, 1 — я).
// Подобрана по десяти напечатанным на коврике слотам, поэтому и продолжение плоскости
// (v≈2 — рука на дереве, u≈−2 — место фигурок) остаётся в ракурсе стола.
const LAYOUTS={
 land:{name:'ландшафт', W:1536, H:864,
  plate:'cut6/plate.png', orig:'out/M6_gpt-5.4-image-2_1.png',
  hom:[[128.86911,-38.73185,515.34001],[-2.73745,176.21965,310.40821],[-0.00658,-0.06685,1]],
  card:[0.838,0.767],
  socket:{0:[-1.235,-0.259], 1:[-1.014,1.203]}, tokenSocket:[-0.855,0.325],
  hand:{v:1.88, u:1.9, step:0.95, tilt:0.10},
  deck:{0:[1235,392], 1:[1235,556]}, tray:[1231,268],
  chipDeck:[1105,585], chipTray:[1092,262],
  hud:{px:[300,760], w:170, h:96, rot:-0.19}, propK:1.0,
  menu:{u:1.85, v:0.62, w:690, h:425},
  punch:{v:1.60, u0:0.35, du:0.82},
  button:[1225,596,1500,830]},
 port:{name:'портрет', W:864, H:1536,
  plate:'out/P1_gpt-5.4-image-2_1.png', orig:'out/P1_gpt-5.4-image-2_1.png',
  hom:[[91.26363,-34.77996,293.45771],[-2.25072,217.57321,570.90534],[-0.00315,-0.0789,1]],
  card:[0.812,0.539],
  socket:{0:[-0.861,-0.152], 1:[-0.631,1.046]}, tokenSocket:[-0.812,0.101],
  hand:{v:1.92, u:2.0, step:0.95, tilt:0.09},
  deck:{0:[777,602], 1:[777,841]}, tray:[777,470],
  chipDeck:[735,935], chipTray:[700,415],
  hud:{px:[170,1385], w:150, h:88, rot:-0.14}, propK:0.68,
  menu:{u:1.5, v:0.48, w:620, h:382},
  punch:{v:1.55, u0:0.35, du:0.82},
  button:null}};
// Выбор судьи (р.6): карта ложится как нарисована, жетон садится на угол карты, сброс — растущая стопка.
const TWEAK={skew:0, token:'corner', discard:'pile'};
let LAY=LAYOUTS.land;
let CANVAS_W=LAY.W, CANVAS_H=LAY.H;
let PLATE=LAY.plate, ORIGINAL=LAY.orig;
let H=LAY.hom, CARD_W=LAY.card[0], CARD_H=LAY.card[1];
const LAND=LAYOUTS.land;                          // холст, в котором нарисованы карты: их исходные четырёхугольники
function Pin(m,u,v){const d=m[2][0]*u+m[2][1]*v+m[2][2];
 return [(m[0][0]*u+m[0][1]*v+m[0][2])/d,(m[1][0]*u+m[1][1]*v+m[1][2])/d]}
function P(u,v){return Pin(H,u,v)}
function quadIn(m,u,v,w,h,rot=0){const c=Math.cos(rot),s=Math.sin(rot);
 return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>Pin(m,u+x*c-y*s,v+x*s+y*c))}
function scaleAt(u,v){const a=P(u,v),b=P(u,v+.01);return Math.hypot(b[0]-a[0],b[1]-a[1])/.01}
const SCALE0=scaleAt(0,1);
function quad(u,v,w,h,rot=0){                     // прямоугольник в плоскости стола → 4 точки на картине
 const c=Math.cos(rot),s=Math.sin(rot);
 return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y])=>P(u+x*c-y*s,v+x*s+y*c))}
function planeSize(u,v,wpx,hpx){       // сколько это в единицах плоскости в данной точке стола
 const du=Math.hypot(...P(u+.5,v).map((c,i)=>c-P(u-.5,v)[i])), dv=Math.hypot(...P(u,v+.5).map((c,i)=>c-P(u,v-.5)[i]));
 return [wpx/du, hpx/dv]}
function layFlat(el,u,v,wpx,hpx,rot=0,z=90){          // положить DOM-прямоугольник в плоскость стола
 const [wu,hv]=planeSize(u,v,wpx,hpx), q=quad(u,v,wu,hv,rot);
 const src=[[0,0],[wpx,0],[wpx,hpx],[0,hpx]];
 el.style.width=wpx+'px';el.style.height=hpx+'px';el.style.transformOrigin='0 0';el.style.zIndex=String(z);
 el.style.transform=mat3d(mul3(unitTo(q),inv3(unitTo(src))))}
function liftQ(q,k){                              // поднять над столом: чуть крупнее и выше
 const cx=(q[0][0]+q[2][0])/2, cy=(q[0][1]+q[2][1])/2, s=1+k*.0016;
 return q.map(([x,y])=>[cx+(x-cx)*s, cy+(y-cy)*s-k])}
function unitTo(q){const [p0,p1,p2,p3]=q;         // единичный квадрат → четырёхугольник
 const dx1=p1[0]-p2[0],dx2=p3[0]-p2[0],dx3=p0[0]-p1[0]+p2[0]-p3[0];
 const dy1=p1[1]-p2[1],dy2=p3[1]-p2[1],dy3=p0[1]-p1[1]+p2[1]-p3[1];
 const den=dx1*dy2-dx2*dy1, g=(dx3*dy2-dx2*dy3)/den, h=(dx1*dy3-dx3*dy1)/den;
 return [p1[0]-p0[0]+g*p1[0], p3[0]-p0[0]+h*p3[0], p0[0],
         p1[1]-p0[1]+g*p1[1], p3[1]-p0[1]+h*p3[1], p0[1], g, h, 1]}
function inv3(m){const [a,b,c,d,e,f,g,h,i]=m;
 const A=e*i-f*h,B=f*g-d*i,C=d*h-e*g,det=a*A+b*B+c*C;
 return [A/det,(c*h-b*i)/det,(b*f-c*e)/det,B/det,(a*i-c*g)/det,(c*d-a*f)/det,C/det,(b*g-a*h)/det,(a*e-b*d)/det]}
function mul3(m,n){const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)
 r[i*3+j]=m[i*3]*n[j]+m[i*3+1]*n[3+j]+m[i*3+2]*n[6+j];return r}
function mat3d(m){const k=1/m[8];
 return `matrix3d(${m[0]*k},${m[3]*k},0,${m[6]*k}, ${m[1]*k},${m[4]*k},0,${m[7]*k}, 0,0,1,0, ${m[2]*k},${m[5]*k},0,1)`}
let HINV=inv3([H[0][0],H[0][1],H[0][2],H[1][0],H[1][1],H[1][2],H[2][0],H[2][1],H[2][2]]);
function planeOf(x,y){const d=HINV[6]*x+HINV[7]*y+HINV[8];
 return [(HINV[0]*x+HINV[1]*y+HINV[2])/d,(HINV[3]*x+HINV[4]*y+HINV[5])/d]}
// ═══ 2. Ассеты ════════════════════════════════════════════════════════════════
// Всё, что лежит на столе, вырезано из холста: карты и кнопка — из мастер-кадра M6,
// блокнот, жетон-выбивка и фишка — из «инвентарного» кадра M7 того же стола. Фигурки нарисованы в картине.
const SPR={
 F:{src:'cut6/cards/F.png', size:[104,145], slot:[0,0]},
 I:{src:'cut6/cards/I.png', size:[103,146], slot:[1,0]},
 R:{src:'cut6/cards/R.png', size:[106,142], slot:[2,0]},
 S:{src:'cut6/cards/S.png', size:[113,157], slot:[2,1]},
 T:{src:'cut6/cards/T.png', size:[112,158], slot:[3,1]},
 BACK:{src:'cut6/cards/BACK.png', size:[122,145]},
 BUTTON:{src:'cut6/sprites/BUTTON.png', box:[1225,596,1500,830]},
 HOUR:{src:'cut/sprites/04.png', box:[300,400,401,551]},
 TRAP:{src:'cut/sprites/07.png', box:[312,540,391,612]}
};
const TOKEN={                                     // жетоны пяти эффектов — «инвентарный» кадр M8
 F:'cut8/sprites/04.png', I:'cut8/sprites/00.png', R:'cut8/sprites/01.png',
 S:'cut8/sprites/02.png', T:'cut8/sprites/03.png'};
const A={notepad:'cut7/sprites/02.png', punch:'cut7/sprites/00.png', chip:'cut7/sprites/01.png'};
const LETTERS=['F','I','R','S','T'];
const COLOR={F:'#2f6ea8',I:'#3f7a3a',R:'#c07a1e',S:'#a8322c',T:'#5a3f9e'};
let SOCKET=LAY.socket;                                // печатные гнёзда: в них стоит маркер хода
let TOKEN_SOCKET=LAY.tokenSocket;                     // второе гнездо противника — под жетон запрета
let TRAP_HOME=LAY.tokenSocket;
let HAND=LAY.hand;
const TOKEN_SPOT={F:'socket', I:'deck', R:'tray', S:'oppCard', T:'myCard'};  // куда ложится жетон эффекта
let DECK=LAY.deck;                                    // колоды нарисованы в плите
let TRAY=LAY.tray;                                    // лоток сброса — тоже нарисован
// ═══ 3. Движок ════════════════════════════════════════════════════════════════
const E={lin:t=>t,sineOut:t=>Math.sin(t*Math.PI/2),pow2In:t=>t*t,pow2Out:t=>1-(1-t)*(1-t),
 pow3In:t=>t*t*t,pow3Out:t=>1-Math.pow(1-t,3),swingOut:t=>{t-=1;return t*t*(3*t+2)+1}};
const $=id=>document.getElementById(id), speed=()=>$('slow').checked?2:1;
const tweens=new Set();
function tween(d,fn,e='lin',done){const t0=performance.now(),tw={};
 tw.step=now=>{const p=Math.min(1,(now-t0)/(d*1000*speed()));fn((E[e]||E.lin)(p),p);
  if(p>=1){tweens.delete(tw);done&&done()}};tweens.add(tw)}
const tw=(d,f,e)=>new Promise(r=>tween(d,f,e,r));
const wait=s=>new Promise(r=>setTimeout(r,s*1000*speed()));
const scene=$('scene'),table=$('table'),fx=$('fx'),ctx=fx.getContext('2d');
let jolt=0, busy=false, lampKick=0, lampMul=1, lampNoise=0, turn=0, sandOn=true;
function fit(){const k=Math.min(innerWidth/CANVAS_W,innerHeight/CANVAS_H);
 scene.style.transform=`translate(${(innerWidth-CANVAS_W*k)/2}px,${(innerHeight-CANVAS_H*k)/2}px) scale(${k})`}
addEventListener('resize',fit);fit();
fx.width=CANVAS_W*1.5;fx.height=CANVAS_H*1.5;ctx.setTransform(1.5,0,0,1.5,0,0);
$('plate').src=PLATE;$('orig').src=ORIGINAL;
// ═══ 4. Карты ═════════════════════════════════════════════════════════════════
const cards={};
function img(src,cls,w,h){const el=new Image();el.src=src;el.className=cls;el.alt='';
 el.style.width=w+'px';if(h)el.style.height=h+'px';table.appendChild(el);return el}
function mkCard(letter){const d=SPR[letter],[su,sv]=d.slot;
 const el=img(d.src,'spr card hit',d.size[0],d.size[1]);
 const back=img(SPR.BACK.src,'spr card',SPR.BACK.size[0],SPR.BACK.size[1]);
 const c={letter,el,back,u:su,v:sv,rot:0,k:1,liftK:0,z:20,face:true,where:'deck',hidden:false,phase:Math.random()*6.28,
  srcQ:[[0,0],[d.size[0],0],[d.size[0],d.size[1]],[0,d.size[1]]],
  backQ:[[0,0],[SPR.BACK.size[0],0],[SPR.BACK.size[0],SPR.BACK.size[1]],[0,SPR.BACK.size[1]]]};
 cards[letter]=c;return c}
function skewQ(q){if(!TWEAK.skew)return q;              // сузить верх: карта читается лежащей на столе
 const k=TWEAK.skew, cx=(q[0][0]+q[1][0])/2;
 return [[q[0][0]+(cx-q[0][0])*k, q[0][1]],[q[1][0]+(cx-q[1][0])*k, q[1][1]],q[2],q[3]]}
function drawCard(c,bob=0){
 const q=liftQ(skewQ(quad(c.u,c.v+bob,CARD_W*c.k,CARD_H*c.k,c.rot)),c.liftK);
 c.el.style.transform=mat3d(mul3(unitTo(q),inv3(unitTo(c.srcQ))));
 c.back.style.transform=mat3d(mul3(unitTo(q),inv3(unitTo(c.backQ))));
 const sh=`drop-shadow(${(2+c.liftK*.10).toFixed(1)}px ${(4+c.liftK*.16).toFixed(1)}px ${(4+c.liftK*.12).toFixed(1)}px rgba(0,0,0,${(.5+Math.min(.25,c.liftK/160)).toFixed(2)}))`;
 c.el.style.filter=sh;c.back.style.filter=sh;
 c.el.style.zIndex=c.z;c.back.style.zIndex=c.z;
 c.el.style.opacity=c.hidden?0:(c.face?1:0);
 c.back.style.opacity=c.hidden?0:(c.face?0:1)}
function setCard(c,u,v,rot=c.rot,k=c.k){c.u=u;c.v=v;c.rot=rot;c.k=k;drawCard(c)}
// ═══ 5. Предметы стола ════════════════════════════════════════════════════════
const objs={};
function mkObj(key,src,w,plane,opts={}){const el=img(src,'obj'+(opts.hit?' hit':'')+(opts.ui?' ui':''),w);
 const o={key,el,w:w*LAY.propK,w0:w,u:plane[0],v:plane[1],rot:0,liftPx:0,scale:1,z:opts.z||30,alpha:1,anchor:opts.anchor||.86};
 if(opts.shadow){const sh=document.createElement('div');sh.className='shadow';table.appendChild(sh);o.shadow=sh}
 if(opts.label!==undefined){const l=document.createElement('div');l.className='lbl';l.textContent=opts.label;
  table.appendChild(l);o.lbl=l}
 objs[key]=o;return o}
function drawObj(o){const [x,y]=P(o.u,o.v), s=o.scale*scaleAt(o.u,o.v)/SCALE0;
 const h=o.el.naturalWidth?o.w*o.el.naturalHeight/o.el.naturalWidth:o.w;
 o.el.style.height=h+'px';
 o.el.style.transformOrigin='50% '+(o.anchor*100)+'%';
 o.el.style.transform=`translate(${x-o.w/2}px,${y-h*o.anchor-o.liftPx}px) scale(${s}) rotate(${o.rot}deg)`;
 o.el.style.zIndex=o.z;o.el.style.opacity=o.alpha;
 if(o.shadow){const sw=o.w*s*.78, sh=sw*.32, k=1-Math.min(.5,o.liftPx/240);
  Object.assign(o.shadow.style,{left:(x-sw/2)+'px',top:(y-sh*.55)+'px',width:sw+'px',height:sh+'px',
   transform:`scale(${k})`,opacity:(.7*k*o.alpha).toFixed(2),zIndex:String(o.z-1)})}
 if(o.lbl){o.lbl.style.transform=`translate(${x-40}px,${y-h*s*.34-o.liftPx}px) scale(${s})`;
  o.lbl.style.setProperty('--fs',(o.w*.40)+'px');o.lbl.style.opacity=o.alpha;o.lbl.style.zIndex=String(o.z+1)}}
LETTERS.forEach(mkCard);
const hour  =mkObj('hour',SPR.HOUR.src,92,SOCKET[0],{z:34,shadow:true,anchor:.85});
const tokens={};                                       // пять жетонов эффектов, лежат вне стола до применения
for(const L of LETTERS){const o=mkObj('tok'+L,TOKEN[L],TWEAK.token==='under'?86:78,TRAP_HOME,{z:TWEAK.token==='under'?16:64,shadow:true,anchor:.5});o.alpha=0;tokens[L]=o}
const trap=tokens.T;

 hour.u=SOCKET[0][0];hour.v=SOCKET[0][1];hour.rot=0;hour.alpha=1;hour.liftPx=0;sandOn=true;
 menu.classList.remove('on');lampMul=1;drawHud()}
async function showAsPainted(){        // «как на картине»: все предметы возвращаются в свои места на холсте
 await reset();
 for(const l of LETTERS){const c=cards[l],[su,sv]=SPR[l].slot;c.hidden=false;c.face=true;c.where='board';setCard(c,su,sv,0,1)}
 hour.alpha=0;LETTERS.forEach(L=>{tokens[L].alpha=0});
 say('Собранная сцена в положении холста — сверьте с оригиналом',4)}
const ACT={all:sceneAll,menu:()=>stepMenu(!menu.classList.contains('on')),deal:()=>stepDeal(4),play:()=>stepPlay(),
 pick:()=>stepPick('T'),tokens:stepAllTokens,discard:stepDiscard,turn:()=>stepTurn(),
 win:stepWin,lose:stepLose,reset,
 orient:()=>applyLayout(LAY===LAYOUTS.land?'port':'land')};
document.querySelectorAll('.acts button').forEach(b=>b.onclick=async()=>{
 const a=b.dataset.act;if(a==='all')return ACT.all();
 if(busy)return;setBusy(true);await ACT[a]();setBusy(false)});
$('ab').onchange=async e=>{if(e.target.checked){await showAsPainted();$('orig').style.opacity=1}
 else{$('orig').style.opacity=0;await reset()}};
$('sm').onchange=e=>{drawSeams();seams.classList.toggle('on',e.target.checked)};
$('minb').onclick=()=>$('panel').classList.toggle('min');
const seams=$('seams');
function drawSeams(){seams.innerHTML='';                 // где проходят границы вырезанного
 for(const [k,d] of Object.entries(SPR)){const b=d.box;if(!b)continue;const r=document.createElement('div');
  r.style.cssText=`left:${b[0]}px;top:${b[1]}px;width:${b[2]-b[0]}px;height:${b[3]-b[1]}px`;seams.appendChild(r)}
 for(const l of LETTERS){const c=cards[l],q=quad(c.u,c.v,CARD_W*c.k,CARD_H*c.k,c.rot);
  const xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);const r=document.createElement('div');
  r.style.cssText=`left:${Math.min(...xs)}px;top:${Math.min(...ys)}px;width:${Math.max(...xs)-Math.min(...xs)}px;height:${Math.max(...ys)-Math.min(...ys)}px`;
  seams.appendChild(r)}}
table.addEventListener('click',e=>{if(busy)return;
 const el=e.target.closest('img');if(!el)return;
 const c=Object.values(cards).find(x=>x.el===el);
 if(c&&c.where==='hand'){c.where='flying';handLayout();
  playCard(c,state.me.length,1).then(()=>{state.me.push(c.letter);drawHud()});return}
 const p=punches.find(o=>o.el===el);if(p&&p.alpha>.5)stepPick(p.letter)});
$('plate').addEventListener('click',e=>{if(busy)return;
 const r=$('plate').getBoundingClientRect(),x=(e.clientX-r.left)/r.width*CANVAS_W,y=(e.clientY-r.top)/r.height*CANVAS_H;
 if(x>1120&&x<1345&&y>180&&y<365)showDiscard()});
reset().then(()=>say('Раунд 6: правки по замечаниям. Нажмите «Сыграть ход».',5));
</script>
