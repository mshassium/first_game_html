<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F!RST · E4 Пять эффектов</title>
<style>
:root{--bg:#15120e;--panel:rgba(30,25,19,.92);--ink:#eadfcd;--muted:#a3957f;--gold:#d3a54a;--rule:#3a3024;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;height:100vh}
#stage{position:absolute;inset:0;overflow:hidden;perspective:1400px}
#scene{position:absolute;inset:0;will-change:transform}
#mat{position:absolute;inset:0;background:#1a1712 center/cover no-repeat}
#lamp{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 60% 55% at 78% 8%,rgba(255,196,110,.28),rgba(255,196,110,0) 70%)}
.zone{position:absolute;border:2px solid rgba(214,196,160,.28);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.zone.target{border-color:rgba(255,220,150,.55);box-shadow:0 0 22px rgba(255,200,120,.25),inset 0 0 0 1px rgba(0,0,0,.35)}
.tray{position:absolute;border-radius:8px;background:rgba(60,40,22,.55);box-shadow:inset 0 0 0 3px rgba(120,86,48,.7),0 8px 20px rgba(0,0,0,.45)}
.deck{position:absolute;border-radius:8px;background:#232746 center/cover;box-shadow:0 2px 0 #1a1d36,0 4px 0 #171a30,0 6px 0 #14172a,0 12px 20px rgba(0,0,0,.5)}
.card{position:absolute;border-radius:6% / 4%;background:#efe6d3 center/cover;box-shadow:0 6px 14px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);transform-style:preserve-3d;will-change:transform;backface-visibility:hidden}
.card .sleeve{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 65%,rgba(255,255,255,.12));pointer-events:none}
.card .frost{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 45%,rgba(200,235,255,0),rgba(170,215,255,.55) 70%,rgba(200,240,255,.85));opacity:0;pointer-events:none;mix-blend-mode:screen}
.card .tint{position:absolute;inset:0;border-radius:inherit;opacity:0;pointer-events:none;mix-blend-mode:multiply}
.card.dim{filter:brightness(.62) saturate(.7)}
.prop{position:absolute;pointer-events:none;will-change:transform;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.prop img{display:block;width:100%;height:100%;object-fit:contain}
.prop .lbl{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:900 var(--fs,20px)/1 Georgia,serif;color:#1e2a44;text-shadow:0 1px 0 rgba(255,255,255,.35)}
#glow{position:absolute;pointer-events:none;border-radius:50%;opacity:0;transform:translate(-50%,-50%);mix-blend-mode:screen}
#fx{position:absolute;inset:0;pointer-events:none}
#caption{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,16,12,.85);border:1px solid var(--rule);color:var(--ink);padding:8px 16px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;max-width:70vw;text-align:center;pointer-events:none}
#caption.on{opacity:1}
#panel{position:absolute;top:12px;left:12px;width:290px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);z-index:10}
#panel h1{font:400 18px Georgia,serif;margin:0 0 2px}
#panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
#panel h2{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{background:#2a231b;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 6px;font:13px inherit;cursor:pointer;text-align:left}
.acts button b{color:var(--gold);font-family:Georgia,serif;font-size:15px;margin-right:6px}
.acts button:hover{border-color:#6a5636}.acts button:disabled{opacity:.5;cursor:default}
.acts button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-top:6px}
#log{font:11px/1.5 var(--mono);color:#cbbfa8;background:#0f0d0a;border-radius:6px;padding:8px;margin-top:6px;max-height:160px;overflow:auto;white-space:pre-wrap}
#panel h1 button{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
#panel.min{width:auto}#panel.min>*:not(h1){display:none}
</style>
<div id="stage">
  <div id="scene">
    <div id="mat"></div><div id="lamp"></div>
    <div class="deck" id="deck0"></div><div class="tray" id="tray0"></div>
    <div class="deck" id="deck1"></div><div class="tray" id="tray1"></div>
    <div id="glow"></div>
    <div id="cards"></div>
    <div id="props"></div>
    <canvas id="fx"></canvas>
  </div>
  <div id="caption"></div>
</div>
<div id="panel">
  <h1>E4 · Пять эффектов <button id="minb">–</button></h1>
  <p class="sub">Каждая кнопка — сценка. Эффекты — предметы на столе. Для теста «на незнакомце» выключи подписи и спроси: что произошло?</p>
  <h2>Сценки</h2>
  <div class="acts">
    <button data-act="F"><b>F</b>запрет → сработал</button>
    <button data-act="I"><b>I</b>прирост</button>
    <button data-act="R"><b>R</b>возврат из сброса</button>
    <button data-act="S"><b>S</b>кража</button>
    <button data-act="T"><b>T</b>ловушка → сработала</button>
    <button data-act="all"><b>▶</b>все подряд</button>
    <button data-act="reset">Сцена заново</button>
  </div>
  <label class="chk"><input type="checkbox" id="cap" checked> подписи «что произошло»</label>
  <label class="chk"><input type="checkbox" id="slow"> замедление ×3</label>
  <h2>Журнал</h2>
  <div id="log"></div>
</div>
<script>
const E={linear:t=>t,sine:t=>(1-Math.cos(Math.PI*t))/2,sineOut:t=>Math.sin(t*Math.PI/2),sineIn:t=>1-Math.cos(t*Math.PI/2),pow2Out:t=>1-(1-t)*(1-t),pow3Out:t=>1-Math.pow(1-t,3),pow2In:t=>t*t,pow3In:t=>t*t*t,pow4In:t=>t*t*t*t,
 swingOut:t=>{const s=2;t=t-1;return t*t*((s+1)*t+s)+1},bounceOut:t=>{const n1=7.5625,d1=2.75;if(t<1/d1)return n1*t*t;if(t<2/d1)return n1*(t-=1.5/d1)*t+.75;if(t<2.5/d1)return n1*(t-=2.25/d1)*t+.9375;return n1*(t-=2.625/d1)*t+.984375},elasticOut:t=>t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1};
const ease=n=>typeof n==='string'?(E[n]||E.linear):n;
// «Упругий» из E1 (принят)
const CH={idle:{amp:3,period:2.4,rot:1.2},play:{dur:.42,ease:'swingOut',arc:90,spin:6,squash:.12},impact:{shake:4,dust:12,glow:.55,dur:.26},draw:{dur:.36,ease:'swingOut'},discard:{dur:.34,ease:'pow2In',tilt:20},hand:{close:.22,ease:'swingOut'},
 prop:{drop:.38,ease:'bounceOut',height:140,shake:5}};
const SCHOOL={F:'#7fb2e6',I:'#3f9a5e',R:'#e39a2a',S:'#c23a2a',T:'#6c3fa0'};
const tweens=new Set(); const speed=()=>document.getElementById('slow').checked?3:1;
function tween(dur,fn,easing='linear',done){const t0=performance.now(),e=ease(easing);const tw={};tw.step=now=>{const p=Math.min(1,(now-t0)/(dur*1000*speed()));fn(e(p),p);if(p>=1){tweens.delete(tw);done&&done()}};tweens.add(tw);return tw}
const tw=(d,f,e)=>new Promise(r=>tween(d,f,e,r)); const wait=s=>new Promise(r=>setTimeout(r,s*1000*speed()));
const stage=document.getElementById('stage'),scene=document.getElementById('scene'),cardsEl=document.getElementById('cards'),propsEl=document.getElementById('props'),fx=document.getElementById('fx'),fctx=fx.getContext('2d');
const A={F:'../e2-letter-hero/out/C1F_gpt-5.4-image-2_1.png',I:'../e2-letter-hero/out/C1I_gpt-5.4-image-2_1.png',R:'../e2-letter-hero/out/C1R_gpt-5.4-image-2_1.png',S:'../e2-letter-hero/out/C1S_gpt-5.4-image-2_1.png',T:'../e2-letter-hero/out/C1T_gpt-5.4-image-2_1.png',
 back:'../e1-living-card/out/CARD_BACK_gpt-5.4-image-2_1.png',mat:'../e1-living-card/out/MAT_gpt-5.4-image-2_1.png',lock:'props/LOCK2.png',trap:'props/TRAP.png',trapc:'props/TRAP_CLOSED.png',pennant:'props/PENNANT.png',hand:'props/HAND.png',tokI:'props/TOKI2.png',tokR:'props/TOKR2.png',tokS:'props/TOKS2.png'};
document.getElementById('mat').style.backgroundImage=`url(${A.mat})`;
let W,H,CW,CHh; const L={zones:[],hand:[],deck:[],tray:[]};
function layout(){W=stage.clientWidth;H=stage.clientHeight;fx.width=W*devicePixelRatio;fx.height=H*devicePixelRatio;fctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 CW=Math.min(H*0.155,(W>900?(W-330):(W-40))/9.8);CHh=CW*1.5; const cx=W>900?(W+300)/2:W*0.5;
 document.querySelectorAll('.zone').forEach(z=>z.remove()); L.zones=[]; const rowW=CW*5+CW*.22*4,x0=cx-rowW/2;
 [[0,0.33],[1,0.62]].forEach(([row,fy])=>{for(let i=0;i<5;i++){const z=document.createElement('div');z.className='zone';const x=x0+i*CW*1.22,y=H*fy-CHh/2;Object.assign(z.style,{left:x+'px',top:y+'px',width:CW+'px',height:CHh+'px'});scene.insertBefore(z,cardsEl);L.zones.push({x,y,row,i,el:z,card:null})}});
 L.hand[0]={y:CHh*0.40,cx,scale:.62}; L.hand[1]={y:H-CHh*0.55,cx,scale:1};
 const dx=Math.min(x0+rowW+CW*.9,W-CW*1.8);
 [[0,0.33],[1,0.62]].forEach(([s,fy])=>{const d=document.getElementById('deck'+s);Object.assign(d.style,{left:dx+'px',top:(H*fy-CHh/2)+'px',width:CW+'px',height:CHh+'px',backgroundImage:`url(${A.back})`});L.deck[s]={x:dx,y:H*fy-CHh/2};
  const t=document.getElementById('tray'+s); const ty=s===0? H*0.33-CHh/2-CHh*0.85 : H*0.62+CHh/2+CHh*0.08; L.tray[s]={x:dx-CW*.25,y:ty,w:CW*1.5,h:CHh*.78};Object.assign(t.style,{left:L.tray[s].x+'px',top:ty+'px',width:L.tray[s].w+'px',height:L.tray[s].h+'px'})});
 L.forbid={x:x0-CW*1.15,y:H*0.33-CW*.5}; L.trap={x:x0-CW*1.15,y:CHh*0.40-CW*.5};
 layoutHand(0,0);layoutHand(1,0);}
const cards=[];let seq=0;
function mkCard(letter,side,faceDown){const el=document.createElement('div');el.className='card';el.innerHTML='<div class="sleeve"></div><div class="frost"></div><div class="tint"></div>';
 const c={id:seq++,letter,side,el,x:0,y:0,rot:0,scale:1,lift:0,sx:1,sy:1,tiltY:0,phase:Math.random()*6.28,where:'hand',faceDown,busy:false};
 el.style.width=CW+'px';el.style.height=CHh+'px';el.style.backgroundImage=`url(${faceDown?A.back:A[letter]})`;cardsEl.appendChild(el);cards.push(c);return c}
function flip(c){c.faceDown=false;c.el.style.backgroundImage=`url(${A[c.letter]})`}
function render(now){for(const t of [...tweens])t.step(now);const t=now/1000;
 for(const c of cards){let dy=0,dr=0;if(c.where==='hand'&&!c.busy&&c.side===1){dy=Math.sin(t*2*Math.PI/CH.idle.period+c.phase)*CH.idle.amp;dr=Math.sin(t*2*Math.PI/CH.idle.period*.7+c.phase)*CH.idle.rot}
  const rest=(c.where==='hand'&&c.side===1&&!c.busy)?-8:0;
  c.el.style.transform=`translate3d(${c.x}px,${c.y-c.lift+dy}px,${c.lift*.6}px) rotateX(${rest}deg) rotateY(${c.tiltY}deg) rotate(${c.rot+dr}deg) scale(${c.scale*c.sx},${c.scale*c.sy})`;
  c.el.style.boxShadow=`0 ${6+c.lift*.7}px ${14+c.lift*1.2}px rgba(0,0,0,${.45+Math.min(.25,c.lift/80)})`}
 for(const p of props){p.el.style.transform=`translate(${p.x}px,${p.y-p.lift}px) rotate(${p.rot}deg) scale(${p.scale})`;p.el.style.opacity=p.alpha}
 drawFx(now);requestAnimationFrame(render)}
requestAnimationFrame(render);
function hand(side){return cards.filter(c=>c.where==='hand'&&c.side===side).sort((a,b)=>a.hi-b.hi)}
function layoutHand(side,dur=CH.hand.close){const hs=hand(side),n=hs.length,sc=L.hand[side].scale,cw=CW*sc,step=Math.min(cw*1.08,(W*.5)/Math.max(1,n));
 hs.forEach((c,i)=>{c.hi=i;const tx=L.hand[side].cx-((n-1)/2)*step+i*step-CW/2,ty=L.hand[side].y-CHh/2+(side?Math.abs(i-(n-1)/2)*4:0),tr=side?(i-(n-1)/2)*2.5:0;c.scale=sc;
  if(dur<=0){c.x=tx;c.y=ty;c.rot=tr;return}const{x:fx0,y:fy0,rot:fr}=c;tween(dur,p=>{c.x=fx0+(tx-fx0)*p;c.y=fy0+(ty-fy0)*p;c.rot=fr+(tr-fr)*p},CH.hand.ease)})}
// ---------- предметы ----------
const props=[];
function mkProp(kind,w,label){const el=document.createElement('div');el.className='prop';el.style.width=w+'px';el.style.height=w+'px';el.innerHTML=`<img src="${A[kind]}" alt="">`+(label?`<div class="lbl" style="--fs:${w*.28}px">${label}</div>`:'');propsEl.appendChild(el);
 const p={el,kind,x:0,y:0,w,lift:0,rot:0,scale:1,alpha:1};props.push(p);return p}
function rmProp(p){p.el.remove();props.splice(props.indexOf(p),1)}
async function dropProp(p,x,y){p.x=x;p.y=y;p.lift=CH.prop.height;p.alpha=0;p.scale=1.25;
 await tw(CH.prop.drop,(e,lin)=>{p.lift=CH.prop.height*(1-e);p.alpha=Math.min(1,lin*4);p.scale=1.25-.25*e},'pow2In');
 shake(CH.prop.shake,.25);dust(x+p.w/2,y+p.w*.8,10);
 await tw(.18,(e,lin)=>{p.scale=1+.08*Math.sin(lin*Math.PI)},'linear')}
async function liftProp(p){await tw(.3,(e,lin)=>{p.lift=120*e;p.alpha=1-e;p.rot=15*e},'pow2In');rmProp(p)}
// ---------- общие движения ----------
function impact(c,cx,cy){tween(CH.impact.dur,(e,lin)=>{const k=Math.sin(lin*Math.PI);c.sx=1+CH.play.squash*k;c.sy=1-CH.play.squash*k},'pow2Out',()=>{c.sx=c.sy=1});
 glow(cx,cy,SCHOOL[c.letter]||'rgba(255,215,140,.55)',CH.impact.glow,CH.impact.dur*1.6);shake(CH.impact.shake,CH.impact.dur*1.4);dust(cx,cy+CHh*.45,CH.impact.dust)}
function glow(x,y,color,a,dur){const g=document.getElementById('glow');g.style.left=x+'px';g.style.top=y+'px';g.style.width=g.style.height=CW*3+'px';g.style.background=`radial-gradient(circle,${color},transparent 70%)`;
 tween(dur,(e,lin)=>{g.style.opacity=a*Math.sin(lin*Math.PI);g.style.transform=`translate(-50%,-50%) scale(${.4+e*.9})`},'pow2Out',()=>g.style.opacity=0)}
function shake(px,dur){tween(dur,(e,lin)=>{const k=(1-lin)*px;scene.style.transform=`translate(${(Math.random()*2-1)*k}px,${(Math.random()*2-1)*k}px)`},'linear',()=>scene.style.transform='')}
async function playCard(c,zone){c.busy=true;c.el.style.zIndex=60;const sx=c.x,sy=c.y,sr=c.rot,s0=c.scale;zone.el.classList.add('target');c.where='flying';layoutHand(c.side);let flipped=!c.faceDown;
 await tw(CH.play.dur*(c.side?1:1.2),(e,lin)=>{c.x=sx+(zone.x-sx)*e;c.y=sy+(zone.y-sy)*e-Math.sin(lin*Math.PI)*CH.play.arc;c.rot=sr*(1-e)+Math.sin(lin*Math.PI)*CH.play.spin;c.scale=s0+(1-s0)*e;c.lift=Math.sin(lin*Math.PI)*30;
  if(!flipped){c.tiltY=180*(1-lin);if(lin>.5){flipped=true;flip(c)}}},CH.play.ease);
 c.x=zone.x;c.y=zone.y;c.rot=0;c.scale=1;c.lift=0;c.tiltY=0;zone.el.classList.remove('target');zone.card=c;c.where='zone';c.zone=zone;impact(c,zone.x+CW/2,zone.y+CHh/2);await wait(CH.impact.dur);c.busy=false;c.el.style.zIndex=''}
async function toTray(c,side,extra={}){c.busy=true;c.el.style.zIndex=70;const T=L.tray[side];const sx=c.x,sy=c.y,sr=c.rot,s0=c.scale;const tx=T.x+T.w/2-CW*.35+(Math.random()*12-6),ty=T.y+T.h/2-CHh*.35+(Math.random()*8-4),trr=Math.random()*24-12;
 if(c.zone){c.zone.card=null;c.zone=null}c.where='flying';layoutHand(c.side);
 await tw(CH.discard.dur,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e-Math.sin(lin*Math.PI)*40;c.rot=sr+(trr-sr)*e+Math.sin(lin*Math.PI)*CH.discard.tilt;c.scale=s0+(.7-s0)*e;if(extra.onStep)extra.onStep(e)},CH.discard.ease);
 c.where='tray';c.busy=false;c.el.style.zIndex=20+seq;c.el.classList.add('dim');dust(tx+CW*.35,ty+CHh*.6,5)}
async function drawCard(side){const c=mkCard('FIRST'[Math.floor(Math.random()*5)],side,true);c.x=L.deck[side].x;c.y=L.deck[side].y;c.where='flying';c.busy=true;c.hi=99;c.el.style.zIndex=60;
 const d=document.getElementById('deck'+side);tween(.18,(e,lin)=>{d.style.transform=`scale(${1-.04*Math.sin(lin*Math.PI)})`},'sineOut',()=>d.style.transform='');
 const hs=hand(side).length,sc=L.hand[side].scale,step=Math.min(CW*sc*1.08,(W*.5)/(hs+1));const tx=L.hand[side].cx-(hs/2)*step+hs*step-CW/2,ty=L.hand[side].y-CHh/2;const sx=c.x,sy=c.y;let fl=false;
 await tw(CH.draw.dur,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e-Math.sin(lin*Math.PI)*60;c.scale=1+(sc-1)*e;if(side===1){c.tiltY=-180*(1-lin);if(lin>.5&&!fl){fl=true;flip(c)}}},CH.draw.ease);
 c.tiltY=0;c.where='hand';c.busy=false;c.el.style.zIndex='';layoutHand(side);return c}
function freeZone(row){return L.zones.find(z=>z.row===row&&!z.card)}
// ---------- частицы ----------
const parts=[];let lastT=performance.now();
function dust(x,y,n,color='#cdb894'){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*90;parts.push({x,y,vx:Math.cos(a)*sp*.6,vy:-Math.abs(Math.sin(a))*sp*.5-20,life:.5+Math.random()*.4,t:0,r:2+Math.random()*4,kind:'dust',color})}}
function sparks(x,y,n,color,dir=-1){for(let i=0;i<n;i++){const a=(Math.random()-.5)*1.4+(dir<0?-Math.PI/2:Math.PI/2),sp=60+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.6+Math.random()*.5,t:0,r:1.5+Math.random()*2.5,kind:'spark',color})}}
function leaves(x,y,n){for(let i=0;i<n;i++){parts.push({x:x+(Math.random()-.5)*CW*.6,y,vx:(Math.random()-.5)*40,vy:-50-Math.random()*60,life:.9+Math.random()*.5,t:0,r:4+Math.random()*4,kind:'leaf',rot:Math.random()*6})}}
function ring(x,y,color){parts.push({x,y,life:.45,t:0,r:CW*.3,kind:'ring',color})}
function trail(from,to,color,n=18,dur=.5){for(let i=0;i<n;i++){setTimeout(()=>parts.push({x:from.x,y:from.y,tx:to.x,ty:to.y,life:dur,t:0,r:3+Math.random()*3,kind:'trail',color,off:(Math.random()-.5)*30}),i*dur*1000*speed()/n)}}
function drawFx(now){const dt=Math.min(.05,(now-lastT)/1000)/speed();lastT=now;fctx.clearRect(0,0,W,H);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}const k=1-p.t/p.life;
  if(p.kind==='ring'){fctx.strokeStyle=p.color;fctx.globalAlpha=k;fctx.lineWidth=3*k+1;fctx.beginPath();fctx.arc(p.x,p.y,p.r+(1-k)*CW*.9,0,Math.PI*2);fctx.stroke();continue}
  if(p.kind==='trail'){const e=E.sineOut(1-k);const x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e-Math.sin(e*Math.PI)*p.off;fctx.globalAlpha=.9*Math.sin((1-k)*Math.PI);fctx.fillStyle=p.color;fctx.beginPath();fctx.arc(x,y,p.r,0,Math.PI*2);fctx.fill();continue}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='dust'?60:p.kind==='leaf'?10:30)*dt;p.vx*=.98;
  if(p.kind==='leaf'){p.rot+=dt*3;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.globalAlpha=k;fctx.fillStyle='#4fb06e';fctx.beginPath();fctx.ellipse(0,0,p.r,p.r*.45,0,0,Math.PI*2);fctx.fill();fctx.restore();continue}
  fctx.globalAlpha=k*(p.kind==='dust'?.55:.95);fctx.fillStyle=p.color||'#dff2ff';fctx.beginPath();fctx.arc(p.x,p.y,p.r*(p.kind==='dust'?1+(1-k):k),0,Math.PI*2);fctx.fill()}
 fctx.globalAlpha=1}
// ---------- подписи и журнал ----------
const capEl=document.getElementById('caption');
function cap(text){log(text);if(!document.getElementById('cap').checked)return;capEl.textContent=text;capEl.classList.add('on');clearTimeout(cap.t);cap.t=setTimeout(()=>capEl.classList.remove('on'),2600*speed())}
function log(t){const l=document.getElementById('log');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight}

// прыжок карты со своего места к точке (tx,ty) и обратно: «карта сама идёт и делает»
async function leapTo(c,tx,ty,dur=.4){c.busy=true;c.el.style.zIndex=90;const sx=c.x,sy=c.y,sr=c.rot;c.home={x:sx,y:sy,rot:sr};
 await tw(dur,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e-Math.sin(lin*Math.PI)*70;c.lift=Math.sin(lin*Math.PI)*40;c.rot=sr+Math.sin(lin*Math.PI)*8},'swingOut');c.lift=0}
async function leapBack(c,dur=.38){const {x:hx,y:hy,rot:hr}=c.home;const sx=c.x,sy=c.y,sr=c.rot;
 await tw(dur,(e,lin)=>{c.x=sx+(hx-sx)*e;c.y=sy+(hy-sy)*e-Math.sin(lin*Math.PI)*70;c.lift=Math.sin(lin*Math.PI)*40;c.rot=sr+(hr-sr)*e},'swingOut');c.lift=0;c.rot=hr;
 dust(c.x+CW/2,c.y+CHh*.9,6);shake(2,.15);c.busy=false;c.el.style.zIndex=''}
async function bump(el,amount=.06){await tw(.22,(e,lin)=>{el.style.transform=`scale(${1-amount*Math.sin(lin*Math.PI)})`},'linear');el.style.transform=''}

// прямой переезд карты (без прыжков): лёгкий подъём в начале, мягкая посадка
async function slide(c,tx,ty,dur=.4,opts={}){c.busy=true;c.el.style.zIndex=90;const sx=c.x,sy=c.y,sr=c.rot,s0=c.scale;const ts=opts.scale??s0,trot=opts.rot??0;
 await tw(dur,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e;c.lift=Math.sin(lin*Math.PI)*18;c.scale=s0+(ts-s0)*e;c.rot=sr+(trot-sr)*e},opts.ease||'sineOut');c.lift=0;c.busy=false}
// ---------- сценки ----------
let busy=false; let forbidProps=null, trapProp=null;
function pick(side,letter){return hand(side).find(c=>c.letter===letter)||hand(side)[0]}
async function sceneF(){ // я играю F, запрещаю S; противник играет S — запрет срабатывает
 const c=pick(1,'F'); await playCard(c,freeZone(1)); cap('Ты разыграл F: запрещаешь противнику букву S');
 sparks(c.x+CW/2,c.y+CHh/2,14,'#bfe0ff'); ring(c.x+CW/2,c.y+CHh/2,'rgba(160,210,255,.9)');
 const lock=mkProp('lock',CW*1.05); await dropProp(lock,L.forbid.x,L.forbid.y); const pen=mkProp('pennant',CW*.8,'S'); pen.x=L.forbid.x+CW*.75;pen.y=L.forbid.y-CW*.35;pen.alpha=0;pen.rot=-25;
 await tw(.3,(e)=>{pen.alpha=e;pen.rot=-25+25*e;pen.lift=30*(1-e)},'swingOut'); snow(L.forbid.x+CW*.5,L.forbid.y+CW*.5,12); forbidProps={lock,pen};
 await wait(.7); cap('Ход противника: он играет S — но S под запретом');
 const o=pick(0,'S'); o.letter='S'; const zone=freeZone(0); o.busy=true;o.el.style.zIndex=60;o.where='flying';layoutHand(0);const sx=o.x,sy=o.y,s0=o.scale; // летит к зоне, но перехватывается замком
 const mx=L.forbid.x+CW*1.25,my=L.forbid.y+CW*.5-CHh/2; let fl=false;
 await tw(.45,(e,lin)=>{o.x=sx+(mx-sx)*e;o.y=sy+(my-sy)*e-Math.sin(lin*Math.PI)*60;o.scale=s0+(1-s0)*e;o.tiltY=180*(1-lin);if(lin>.5&&!fl){fl=true;flip(o)}},'swingOut'); o.tiltY=0;
 // замок вспыхивает, карта дрожит, иней
 ring(mx+CW/2,my+CHh/2,'rgba(160,210,255,.9)'); glow(mx+CW/2,my+CHh/2,'rgba(170,215,255,.8)',.8,.5); shake(5,.3);
 const frost=o.el.querySelector('.frost'); await tw(.3,(e,lin)=>{o.rot=Math.sin(lin*Math.PI*10)*5*(1-lin);lock.scale=1+.15*Math.sin(lin*Math.PI)},'linear'); o.rot=0;
 await tw(.4,e=>{frost.style.opacity=e},'sineOut'); snow(mx+CW/2,my+CHh/2,16); cap('Запрет сработал: карта S уходит в его сброс, замок снимается');
 await wait(.3); toTray(o,0,{onStep:e=>{frost.style.opacity=1-e}}); await liftProp(pen); await liftProp(lock); forbidProps=null; await wait(.4);}
async function sceneI(){const c=pick(1,'I'); await playCard(c,freeZone(1)); cap('Ты разыграл I: жетон ложится на твою колоду — берёшь дополнительную карту');
 const D=L.deck[1]; const tk=mkProp('tokI',CW*.9); await dropProp(tk,D.x+CW*.05,D.y+CHh*.28); await bump(document.getElementById('deck1'),.06);
 await wait(.15); await drawCard(1); await wait(.25); await liftProp(tk); await wait(.3)}
async function sceneR(){ if(!cards.some(k=>k.where==='tray'&&k.side===1)){const d=mkCard('T',1,false);d.x=L.tray[1].x+CW*.3;d.y=L.tray[1].y+CHh*.1;d.scale=.7;d.rot=8;d.where='tray';d.el.classList.add('dim')}
 const c=pick(1,'R'); await playCard(c,freeZone(1)); cap('Ты разыграл R: жетон ложится в твой сброс — карта оттуда возвращается в руку');
 const T=L.tray[1]; const tk=mkProp('tokR',CW*.9); await dropProp(tk,T.x+T.w-CW*.95,T.y+T.h-CW*.95); 
 const r=cards.filter(k=>k.where==='tray'&&k.side===1).pop(); r.el.classList.remove('dim'); r.where='flying';
 const hs=hand(1).length,step=Math.min(CW*1.08,(W*.5)/(hs+1));const tx=L.hand[1].cx-(hs/2)*step+hs*step-CW/2,ty=L.hand[1].y-CHh/2;
 await wait(.15); await slide(r,tx,ty,.45,{scale:1,rot:0,ease:'swingOut'}); r.hi=99;r.where='hand';r.el.style.zIndex='';layoutHand(1);
 await wait(.2); await liftProp(tk); await wait(.3)}
async function sceneS(){ if(!L.zones.some(z=>z.row===0&&z.card)){const o=hand(0)[0];o.letter='I';await playCard(o,freeZone(0));await wait(.2)}
 const c=pick(1,'S'); await playCard(c,freeZone(1)); cap('Ты разыграл S: жетон ложится под карту противника — она уходит в его сброс');
 const target=L.zones.filter(z=>z.row===0&&z.card).pop().card; const tk=mkProp('tokS',CW*.9);
 await dropProp(tk,target.x+CW*.05,target.y+CHh+CW*.05); // жетон у нижнего края карты, на коврике
 const tint=target.el.querySelector('.tint');tint.style.background='#7a1f1a'; await tw(.15,e=>{tint.style.opacity=.4*e},'linear');
 const T=L.tray[0]; target.zone.card=null;target.zone=null;target.where='flying';
 await wait(.1); await slide(target,T.x+T.w/2-CW*.35,T.y+T.h/2-CHh*.35,.45,{scale:.7,rot:-14,ease:'pow2In'});
 target.where='tray';target.el.classList.add('dim');target.el.style.zIndex=20+seq; dust(target.x+CW*.35,target.y+CHh*.6,6,'#3a1a16'); tw(.3,e=>{tint.style.opacity=.4*(1-e)},'linear');
 await wait(.2); await liftProp(tk); await wait(.3)}
async function sceneT(){const c=pick(1,'T'); await playCard(c,freeZone(1)); cap('Ты разыграл T: капкан ложится у руки противника — на своём ходу он потеряет карту');
 const tr=mkProp('trap',CW*1.05); await dropProp(tr,L.trap.x,L.trap.y); trapProp=tr; await wait(.8);
 cap('Ход противника: капкан захлопывается — карта из его руки уходит в сброс');
 const victim=hand(0)[Math.floor(hand(0).length/2)]; victim.busy=true; victim.el.style.zIndex=88;
 tr.el.querySelector('img').src=A.trapc; shake(6,.3); ring(tr.x+tr.w/2,tr.y+tr.w/2,'rgba(200,160,255,.9)'); dust(tr.x+tr.w/2,tr.y+tr.w*.8,10);
 await tw(.3,(e,lin)=>{tr.scale=1+.2*Math.sin(lin*Math.PI);victim.lift=26*Math.sin(lin*Math.PI);victim.rot=Math.sin(lin*Math.PI*6)*5*(1-lin)},'linear'); victim.rot=0;victim.lift=0; flip(victim);
 const T=L.tray[0]; victim.where='flying'; layoutHand(0);
 await slide(victim,T.x+T.w/2-CW*.35,T.y+T.h/2-CHh*.35,.45,{scale:.7,rot:-12,ease:'pow2In'});
 victim.where='tray';victim.el.classList.add('dim');victim.el.style.zIndex=20+seq; dust(victim.x+CW*.35,victim.y+CHh*.6,6);
 await wait(.25); await liftProp(tr); trapProp=null; await wait(.3)}
async function run(act){if(busy)return;busy=true;document.querySelectorAll('.acts button').forEach(b=>b.disabled=true);
 try{ if(act==='all'){reset();await wait(.3);for(const k of ['F','I','R','S','T']){await ({F:sceneF,I:sceneI,R:sceneR,S:sceneS,T:sceneT})[k]();await wait(.6)}} else if(act==='reset') reset(); else await ({F:sceneF,I:sceneI,R:sceneR,S:sceneS,T:sceneT})[act](); }
 catch(e){log('ошибка: '+e.message);console.error(e)}
 busy=false;document.querySelectorAll('.acts button').forEach(b=>b.disabled=false)}
function snow(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=20+Math.random()*60;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7+Math.random()*.5,t:0,r:1.5+Math.random()*2.5,kind:'spark',color:'#dff2ff'})}}
function reset(){cards.splice(0).forEach(c=>c.el.remove());props.splice(0).forEach(p=>p.el.remove());L.zones.forEach(z=>z.card=null);document.getElementById('log').textContent='';
 'FIRST'.split('').forEach((l,i)=>{const c=mkCard(l,1,false);c.hi=i}); for(let i=0;i<5;i++){const c=mkCard('FIRST'[i],0,true);c.hi=i} layoutHand(0,0);layoutHand(1,0)}
document.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>run(b.dataset.act));
document.getElementById('minb').onclick=()=>{const p=document.getElementById('panel');p.classList.toggle('min');document.getElementById('minb').textContent=p.classList.contains('min')?'+':'–'};
window.addEventListener('resize',()=>{layout();cards.forEach(c=>{c.el.style.width=CW+'px';c.el.style.height=CHh+'px'});layoutHand(0,0);layoutHand(1,0)});
layout();reset();
