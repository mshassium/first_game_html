<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F!RST · E5 Ритуалы</title>
<style>
:root{--bg:#15120e;--panel:rgba(30,25,19,.92);--ink:#eadfcd;--muted:#a3957f;--gold:#d3a54a;--rule:#3a3024;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;height:100vh}
#stage{position:absolute;inset:0;overflow:hidden;perspective:1400px}
#scene{position:absolute;inset:0;will-change:transform}
.layer{position:absolute;inset:-3%}
#bg{background:#1a1712 center/cover no-repeat}
#lamp{pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 55% 60% at 88% 4%,rgba(255,190,100,var(--la,.44)),rgba(255,190,100,0) 72%)}
#dark{pointer-events:none;background:radial-gradient(ellipse 80% 90% at 88% 4%,rgba(0,0,0,0),rgba(0,0,0,var(--da,.34)) 100%)}
#night{position:absolute;inset:0;background:radial-gradient(circle at 88% 4%,rgba(255,170,70,.55) 0,rgba(255,170,70,.12) 2%,rgba(7,6,10,1) 9%);opacity:0;pointer-events:none;z-index:50}
.zone{position:absolute;border:2px solid rgba(214,196,160,.22);border-radius:10px}
.socket{position:absolute;border-radius:50%;border:2px solid rgba(214,196,160,.24);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 0 12px rgba(0,0,0,.35)}
.socket::after{content:'';position:absolute;inset:14%;border-radius:50%;border:1px dashed rgba(214,196,160,.18)}
.mini{position:absolute;transform-origin:50% 90%;cursor:pointer}.mini img{display:block;width:100%;height:auto}
.shadow{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.75),rgba(0,0,0,.42) 45%,rgba(0,0,0,0) 72%);filter:blur(3px);opacity:.7}
.prop{position:absolute;pointer-events:none;will-change:transform;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}.prop img{display:block;width:100%;height:100%;object-fit:contain}
.die{position:absolute;pointer-events:none;perspective:260px;will-change:transform}
.die .cube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.die .f{position:absolute;inset:0;background:#4a2f1c center/cover no-repeat;border-radius:14%;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.dieShadow{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);filter:blur(3px)}
.deck{position:absolute;border-radius:8px;background:#232746 center/cover;box-shadow:0 2px 0 #1a1d36,0 4px 0 #171a30,0 6px 0 #14172a,0 12px 20px rgba(0,0,0,.5)}
.card{position:absolute;border-radius:6% / 4%;background:#efe6d3 center/cover;box-shadow:0 6px 14px rgba(0,0,0,.45);will-change:transform;backface-visibility:hidden}
.card.dim{filter:brightness(.6) saturate(.7)}
#note{position:absolute;pointer-events:none;will-change:transform;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6));opacity:0}
#note img{display:block;width:100%;height:100%}
#note .txt{position:absolute;left:12%;top:26%;width:70%;text-align:center;font:italic 700 var(--fs,36px)/1.05 Georgia,serif;color:#3a2a1a;transform:rotate(-4deg);letter-spacing:.02em}
#note .sub{position:absolute;left:14%;top:52%;width:66%;text-align:center;font:italic 400 var(--fs2,16px)/1.3 Georgia,serif;color:#5a4633;transform:rotate(-4deg)}
#note .btns{position:absolute;left:14%;top:70%;width:66%;display:flex;justify-content:space-around;font:italic 600 var(--fs2,16px)/1 Georgia,serif;color:#3a2a1a;transform:rotate(-4deg)}
#note .btns span{border:2px solid rgba(58,42,26,.55);border-radius:40% 45% 42% 48% / 60% 55% 60% 50%;padding:6px 10px}
#fx{position:absolute;inset:0;pointer-events:none}
#turn{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:600 13px/1 var(--mono);letter-spacing:.08em;color:var(--gold);text-shadow:0 1px 2px #000}
#panel{position:absolute;top:12px;right:12px;width:270px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;backdrop-filter:blur(6px);z-index:10}
#panel h1{font:400 18px Georgia,serif;margin:0 0 2px}#panel .sub{color:var(--muted);font-size:12px;margin:0 0 10px}
#panel h2{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{background:#2a231b;color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 6px;font:13px inherit;cursor:pointer;text-align:left}
.acts button:hover{border-color:#6a5636}.acts button:disabled{opacity:.5}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-top:5px}
#panel h1 button{float:right;background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
#panel.min{width:auto}#panel.min>*:not(h1){display:none}
#log{font:11px/1.5 var(--mono);color:#cbbfa8;background:#0f0d0a;border-radius:6px;padding:8px;margin-top:6px;max-height:120px;overflow:auto;white-space:pre-wrap}
</style>
<div id="stage">
  <div id="scene">
    <div class="layer" id="bg"></div><div class="layer" id="dark"></div><div class="layer" id="lamp"></div>
    <div class="layer" id="table"></div>
    <canvas id="fx"></canvas>
    <div id="night"></div>
    <div id="note"><img alt=""><div class="txt"></div><div class="sub"></div><div class="btns"><span>Ещё партию</span><span>Меню</span></div></div>
  </div>
  <div id="turn"></div>
</div>
<div id="panel">
  <h1>E5 · Ритуалы <button id="minb">–</button></h1>
  <p class="sub">Начало и конец партии как события на столе: кубики решают, кто ходит; блокнот на столе — экран результата.</p>
  <h2>Сценки</h2>
  <div class="acts">
    <button data-act="start">Начало партии</button>
    <button data-act="win">Победа</button>
    <button data-act="lose">Поражение</button>
    <button data-act="screen">Смена экрана: лампу выкл/вкл</button>
    <button data-act="reset">Сцена заново</button>
  </div>
  <label class="chk"><input type="checkbox" id="slow"> замедление ×3</label>
  <h2>Журнал</h2><div id="log"></div>
</div>
<script>
const E={sineOut:t=>Math.sin(t*Math.PI/2),sineIn:t=>1-Math.cos(t*Math.PI/2),pow2Out:t=>1-(1-t)*(1-t),pow2In:t=>t*t,pow3Out:t=>1-Math.pow(1-t,3),swingOut:t=>{const s=2;t=t-1;return t*t*((s+1)*t+s)+1},linear:t=>t,
 bounceOut:t=>{const n1=7.5625,d1=2.75;if(t<1/d1)return n1*t*t;if(t<2/d1)return n1*(t-=1.5/d1)*t+.75;if(t<2.5/d1)return n1*(t-=2.25/d1)*t+.9375;return n1*(t-=2.625/d1)*t+.984375}};
const $=id=>document.getElementById(id); const speed=()=>$('slow').checked?3:1;
const tweens=new Set();function tween(d,fn,e='linear',done){const t0=performance.now();const tw={};tw.step=now=>{const p=Math.min(1,(now-t0)/(d*1000*speed()));fn((E[e]||E.linear)(p),p);if(p>=1){tweens.delete(tw);done&&done()}};tweens.add(tw)}
const tw=(d,f,e)=>new Promise(r=>tween(d,f,e,r)); const wait=s=>new Promise(r=>setTimeout(r,s*1000*speed()));
const A={bg:'../e3-living-table/out/BG_gpt-5.4-image-2_1.png',opp:'../e3-living-table/props/TOP_OPP.png',me:'../e3-living-table/props/TOP_ME.png',turn:'../e3-living-table/props/TOP_TURN.png',note:'props/NOTE.png',back:'../e1-living-card/out/CARD_BACK_gpt-5.4-image-2_1.png',
 F:'../e2-letter-hero/out/C1F_gpt-5.4-image-2_1.png',I:'../e2-letter-hero/out/C1I_gpt-5.4-image-2_1.png',R:'../e2-letter-hero/out/C1R_gpt-5.4-image-2_1.png',S:'../e2-letter-hero/out/C1S_gpt-5.4-image-2_1.png',T:'../e2-letter-hero/out/C1T_gpt-5.4-image-2_1.png'};
Object.assign(A,{b1:'props/D6_BLUE_1.png',b2:'props/D6_BLUE_2.png',b3:'props/D6_BLUE_3.png',b4:'props/D6_BLUE_4.png',b5:'props/D6_BLUE_5.png',b6:'props/D6_BLUE_6.png',g1:'props/D6_GREEN_1.png',g2:'props/D6_GREEN_2.png',g3:'props/D6_GREEN_3.png',g4:'props/D6_GREEN_4.png',g5:'props/D6_GREEN_5.png',g6:'props/D6_GREEN_6.png'});
$('bg').style.backgroundImage=`url(${A.bg})`;$('note').querySelector('img').src=A.note;
const stage=$('stage'),scene=$('scene'),table=$('table'),fx=$('fx'),ctx=fx.getContext('2d');
let W,H,CW,CHh;const minis={},zones=[],cards=[],props=[];let turnEl,turnP,turn=1,busy=false;
function layout(){W=stage.clientWidth;H=stage.clientHeight;fx.width=W*devicePixelRatio;fx.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 CW=Math.min(H*0.15,W*0.075);CHh=CW*1.5;table.innerHTML='';zones.length=0;cards.length=0;props.length=0;dice.length=0;
 const mw=CW*1.4;for(const [k,src,fy] of [['opp',A.opp,0.10],['me',A.me,0.52]]){const x=W*0.145,y=H*fy,mh=mw*1.5;
  const sh=document.createElement('div');sh.className='shadow';Object.assign(sh.style,{left:(x+mw*.02)+'px',top:(y+mh*.80)+'px',width:mw*.96+'px',height:mw*.36+'px'});table.appendChild(sh);
  const el=document.createElement('div');el.className='mini';el.style.width=mw+'px';el.style.left=x+'px';el.style.top=y+'px';el.innerHTML=`<img src="${src}" alt="">`;table.appendChild(el);minis[k]={el,x,y,w:mw,h:mh,rot:0,lift:0};el.onclick=()=>hop(k)
  for(let i=0;i<2;i++){const s=document.createElement('div');s.className='socket';const d=CW*.9;Object.assign(s.style,{left:(x+mw*1.08)+'px',top:(y+mw*.45+i*d*1.18)+'px',width:d+'px',height:d+'px'});table.appendChild(s)}}
 const cx=W*0.585,rowW=CW*5+CW*.22*4,x0=cx-rowW/2;[[0,0.31],[1,0.60]].forEach(([row,fy])=>{for(let i=0;i<5;i++){const z=document.createElement('div');z.className='zone';const x=x0+i*CW*1.22,y=H*fy-CHh/2;Object.assign(z.style,{left:x+'px',top:y+'px',width:CW+'px',height:CHh+'px'});table.appendChild(z);zones.push({x,y,row,i,card:null,el:z})}});
 L.hand={0:{y:CHh*.40,cx,scale:.62},1:{y:H-CHh*.55,cx,scale:1}};const dx=Math.min(x0+rowW+CW*.9,W-CW*1.8);L.deck={0:{x:dx,y:H*0.31-CHh/2},1:{x:dx,y:H*0.60-CHh/2}};
 for(const s of [0,1]){const d=document.createElement('div');d.className='deck';d.id='deck'+s;Object.assign(d.style,{left:L.deck[s].x+'px',top:L.deck[s].y+'px',width:CW+'px',height:CHh+'px',backgroundImage:`url(${A.back})`});table.appendChild(d)}
 turnEl=document.createElement('div');turnEl.className='prop';turnEl.style.width=turnEl.style.height=CW*.7+'px';turnEl.innerHTML=`<img src="${A.turn}" alt="">`;table.appendChild(turnEl);turnP={x:0,y:0,lift:0};const tp=turnPos(turn);turnP.x=tp.x;turnP.y=tp.y;$('turn').textContent=turn?'ТВОЙ ХОД':'ХОД ПРОТИВНИКА';
 const n=$('note');const nw=Math.min(W*.34,H*.6);Object.assign(n.style,{width:nw+'px',height:nw+'px',left:(cx-nw/2)+'px',top:(H*.5-nw/2)+'px'});n.style.setProperty('--fs',nw*.11+'px');n.style.setProperty('--fs2',nw*.05+'px');n.style.opacity=0;}
const L={};
function turnPos(t){const m=minis[t?'me':'opp'];return{x:m.x-CW*.5,y:m.y+m.h*.62}}
function setTurn(t){turn=t;$('turn').textContent=t?'ТВОЙ ХОД':'ХОД ПРОТИВНИКА';const tp=turnPos(t),sx=turnP.x,sy=turnP.y;return tw(.5,(e,lin)=>{turnP.x=sx+(tp.x-sx)*e;turnP.y=sy+(tp.y-sy)*e;turnP.lift=Math.sin(lin*Math.PI)*50},'sineOut').then(()=>{turnP.lift=0;dust(tp.x+CW*.3,tp.y+CW*.5,5);jolt=Math.max(jolt,1.5)})}
let jolt=0,lampA=.44,lampKick=0,lampNoise=0,lampMul=1;
function render(now){for(const t of [...tweens])t.step(now);const t=now/1000;
 lampNoise+=(Math.random()-.5)*.03;lampNoise*=.9;lampA=(.44+Math.sin(t*.7)*.05+Math.sin(t*2.3)*.015+lampNoise*.8+lampKick)*lampMul;lampKick*=.85;
 document.documentElement.style.setProperty('--la',lampA.toFixed(3));document.documentElement.style.setProperty('--da',(.34-(lampA-.44)*.8).toFixed(3));
 for(const k in minis){const m=minis[k];m.el.style.transform=`translate(0,${-m.lift}px) rotate(${m.rot}deg)`}
 if(turnEl)turnEl.style.transform=`translate(${turnP.x}px,${turnP.y-turnP.lift}px) scale(${1+turnP.lift/150})`;
 for(const p of props){p.el.style.transform=`translate(${p.x}px,${p.y-p.lift}px) rotate(${p.rot}deg) scale(${p.scale})`;p.el.style.opacity=p.alpha}
 renderDice();
 for(const c of cards){let dy=0,dr=0;if(c.where==='hand'&&c.side===1&&!c.busy){dy=Math.sin(t*2*Math.PI/2.4+c.phase)*3;dr=Math.sin(t*2*Math.PI/2.4*.7+c.phase)*1.2}c.el.style.transform=`translate3d(${c.x}px,${c.y-c.lift+dy}px,0) rotateX(${c.where==='hand'&&c.side===1?-8:0}deg) rotateY(${c.tiltY||0}deg) rotate(${c.rot+dr}deg) scale(${c.scale})`}
 if(jolt>0){scene.style.transform=`translate(${(Math.random()*2-1)*jolt}px,${(Math.random()*2-1)*jolt}px)`;jolt*=.86;if(jolt<.3){jolt=0;scene.style.transform=''}}
 drawFx();requestAnimationFrame(render)}
requestAnimationFrame(render);
// частицы
const parts=[];let last=performance.now();
function dust(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*90;parts.push({x,y,vx:Math.cos(a)*sp*.6,vy:-Math.abs(Math.sin(a))*sp*.5-20,life:.5+Math.random()*.4,t:0,r:2+Math.random()*4,kind:'dust'})}}
function confetti(x,y,n){const cols=['#e04a3a','#3f9a5e','#e39a2a','#7fb2e6','#8a5fc9','#f2dfa6'];for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*1.6,sp=180+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.6+Math.random()*.8,t:0,r:3+Math.random()*4,kind:'paper',color:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*10})}}
function drawFx(){const now=performance.now();const dt=Math.min(.05,(now-last)/1000)/speed();last=now;ctx.clearRect(0,0,W,H);
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue}const k=1-p.t/p.life;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.kind==='paper'){p.vy+=320*dt;p.vx*=.985;p.rot+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,k*3);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore();continue}
  p.vy+=60*dt;p.vx*=.98;ctx.globalAlpha=k*.55;ctx.fillStyle='#cdb894';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(2-k),0,Math.PI*2);ctx.fill()}
 ctx.globalAlpha=1}
// карты
let seq=0;
function mkCard(letter,side,faceDown){const el=document.createElement('div');el.className='card';el.style.width=CW+'px';el.style.height=CHh+'px';el.style.backgroundImage=`url(${faceDown?A.back:A[letter]})`;table.appendChild(el);const c={id:seq++,letter,side,el,x:0,y:0,rot:0,scale:1,lift:0,tiltY:0,phase:Math.random()*6.28,where:'hand',faceDown,busy:false};cards.push(c);return c}
function flip(c){c.faceDown=false;c.el.style.backgroundImage=`url(${A[c.letter]})`}
function hand(side){return cards.filter(c=>c.where==='hand'&&c.side===side).sort((a,b)=>a.hi-b.hi)}
function layoutHand(side,dur=.22){const hs=hand(side),n=hs.length,sc=L.hand[side].scale,step=Math.min(CW*sc*1.08,(W*.5)/Math.max(1,n));hs.forEach((c,i)=>{c.hi=i;const tx=L.hand[side].cx-((n-1)/2)*step+i*step-CW/2,ty=L.hand[side].y-CHh/2+(side?Math.abs(i-(n-1)/2)*4:0),tr=side?(i-(n-1)/2)*2.5:0;c.scale=sc;if(dur<=0){c.x=tx;c.y=ty;c.rot=tr;return}const{x:fx0,y:fy0,rot:fr}=c;tween(dur,p=>{c.x=fx0+(tx-fx0)*p;c.y=fy0+(ty-fy0)*p;c.rot=fr+(tr-fr)*p},'swingOut')})}
async function deal(side,letter){const c=mkCard(letter,side,true);c.x=L.deck[side].x;c.y=L.deck[side].y;c.where='flying';c.busy=true;c.hi=99;c.el.style.zIndex=60;const d=$('deck'+side);tween(.18,(e,lin)=>{d.style.transform=`scale(${1-.04*Math.sin(lin*Math.PI)})`},'sineOut',()=>d.style.transform='');
 const hs=hand(side).length,sc=L.hand[side].scale,step=Math.min(CW*sc*1.08,(W*.5)/(hs+1));const tx=L.hand[side].cx-(hs/2)*step+hs*step-CW/2,ty=L.hand[side].y-CHh/2;const sx=c.x,sy=c.y;let fl=false;
 await tw(.36,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e-Math.sin(lin*Math.PI)*60;c.scale=1+(sc-1)*e;if(side===1){c.tiltY=-180*(1-lin);if(lin>.5&&!fl){fl=true;flip(c)}}},'swingOut');c.tiltY=0;c.where='hand';c.busy=false;c.el.style.zIndex='';layoutHand(side)}
function hop(k){const m=minis[k];if(m.h_)return;m.h_=1;tw(.5,(e,lin)=>{m.lift=Math.sin(lin*Math.PI)*40},'sineOut').then(()=>{m.lift=0;dust(m.x+m.w/2,m.y+m.h*.9,10);jolt=Math.max(jolt,3);m.h_=0})}
function bounceMinis(){for(const k in minis){const m=minis[k];tween(.45,(e,lin)=>{m.rot=Math.sin(lin*Math.PI*4)*2.5*(1-lin);m.lift=Math.max(0,Math.sin(lin*Math.PI*2))*4},'linear',()=>{m.rot=0;m.lift=0})}}
function log(s){const l=$('log');l.textContent+=s+'\n';l.scrollTop=l.scrollHeight}
// ---------- ритуалы ----------
function mkProp(src,w){const el=document.createElement('div');el.className='prop';el.style.width=w+'px';el.style.height=w+'px';el.innerHTML=`<img src="${src}" alt="">`;table.appendChild(el);const p={el,x:0,y:0,w,lift:0,rot:0,scale:1,alpha:1};props.push(p);return p}

// объёмный кубик: шесть граней, катится по столу кувырками
const FACE_ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]}; // [rotateX, rotateY], чтобы грань смотрела на зрителя
function mkDie(w,set='b'){const el=document.createElement('div');el.className='die';el.style.width=el.style.height=w+'px';const cube=document.createElement('div');cube.className='cube';el.appendChild(cube);
 const faces={1:`rotateY(0deg) translateZ(${w/2}px)`,6:`rotateY(180deg) translateZ(${w/2}px)`,3:`rotateY(90deg) translateZ(${w/2}px)`,4:`rotateY(-90deg) translateZ(${w/2}px)`,2:`rotateX(90deg) translateZ(${w/2}px)`,5:`rotateX(-90deg) translateZ(${w/2}px)`};
 for(const n in faces){const f=document.createElement('div');f.className='f';f.style.backgroundImage=`url(${A[set+n]})`;f.style.transform=faces[n];cube.appendChild(f)}
 const sh=document.createElement('div');sh.className='dieShadow';sh.style.width=w*1.2+'px';sh.style.height=w*.7+'px';table.appendChild(sh);table.appendChild(el);
 const d={el,cube,sh,x:0,y:0,w,lift:0,rx:0,ry:0,alpha:1};dice.push(d);return d}
const dice=[];
function renderDice(){for(const d of dice){d.el.style.transform=`translate(${d.x}px,${d.y-d.lift}px) scale(${1+d.lift/600})`;d.el.style.opacity=d.alpha;d.cube.style.transform=`rotateX(${d.rx}deg) rotateY(${d.ry}deg)`;
 d.sh.style.transform=`translate(${d.x-d.w*.1}px,${d.y+d.w*.55+d.lift*.15}px) scale(${1-Math.min(.5,d.lift/300)})`;d.sh.style.opacity=d.alpha*(1-Math.min(.6,d.lift/200))}}
async function rollDie(d,x1,y1,face,dur=1.4,from='right'){const w=d.w;const x0=W*0.98,y0=from==='top'?-w*2:(from==='bottom'?H+w:y1-H*0.03);d.x=x0;d.y=y0;d.alpha=1;const dist=x0-x1;
 const [fx,fy]=FACE_ROT[face];const turnsX=-(3+Math.floor(Math.random()*2))*360, turnsY=(Math.random()<.5?1:-1)*360*(1+Math.floor(Math.random()*2));
 const rx0=fx+turnsX, ry0=fy+turnsY; // начинаем «закрученными», к концу докручиваемся ровно до нужной грани
 await tw(dur,(e,lin)=>{d.x=x0-dist*e;d.y=y0+(y1-y0)*E.pow2Out(lin);d.rx=rx0+(fx-rx0)*e;d.ry=ry0+(fy-ry0)*e;
  const bounces=3;d.lift=Math.abs(Math.sin(lin*Math.PI*bounces))*w*1.6*(1-lin)*(1-lin);
  if(lin>.12&&Math.abs(Math.sin(lin*Math.PI*bounces))<.05&&Math.random()<.6)dust(d.x+w/2,d.y+w*.9,2)},'pow3Out');
 d.rx=fx;d.ry=fy;d.lift=0;dust(x1+w/2,y1+w*.9,8);jolt=Math.max(jolt,3)}
async function nudgeDie(d){await tw(.35,(e,lin)=>{d.lift=Math.sin(lin*Math.PI)*d.w*.7},'sineOut');d.lift=0;dust(d.x+d.w/2,d.y+d.w*.9,5)}
async function clearDice(ds){await Promise.all(ds.map((d,i)=>tw(.45+i*.06,(e,lin)=>{d.x=d.x+(W*1.05-d.x)*e;d.rx+= -180*e;d.lift=Math.sin(lin*Math.PI)*20},'pow2In')));ds.forEach(d=>{d.el.remove();d.sh.remove();dice.splice(dice.indexOf(d),1)})}
async function sceneStart(){log('Начало партии: кубики решают, кто ходит первым');const dw=CW*.34;const d0=mkDie(dw,'b'),d1=mkDie(dw,'g');const cx=W*0.585;
 let a,b;do{a=1+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*6)}while(a===b);
 log('Синий кубик — противника (с его стороны), зелёный — твой');const r0=rollDie(d0,cx-CW*.4,H*.40-dw/2,a,1.45,'top');await wait(.25);const r1=rollDie(d1,cx+CW*.4,H*.52-dw/2,b,1.4,'bottom');await Promise.all([r0,r1]);
 await wait(.5);const win=a>b?0:1;log(`Противник ${a} · Ты ${b} → первым ходит ${win?'ты':'противник'}`);
 await nudgeDie(win?d1:d0);
 await setTurn(win);await wait(.3);
 // кубики убирают со стола
 await clearDice([d0,d1]);
 // раздача: по 5 карт, поочерёдно, начиная с первого игрока
 log('Раздача: по 5 карт');const letters=['F','I','R','S','T'];for(let i=0;i<5;i++){const first=win,second=win?0:1;deal(first,letters[(i+2)%5]);await wait(.14);deal(second,letters[(i*3)%5]);await wait(.14)}await wait(.5);log('Партия началась')}
async function fillRow(row){const letters=['F','I','R','S','T'];const zs=zones.filter(z=>z.row===row);for(let i=0;i<5;i++){const z=zs[i];if(z.card)continue;const c=mkCard(letters[i],row,false);c.x=z.x;c.y=z.y;c.where='zone';z.card=c}}
async function wave(row){const zs=zones.filter(z=>z.row===row&&z.card);for(const z of zs){const c=z.card;tween(.36,(e,lin)=>{c.lift=Math.sin(lin*Math.PI)*28},'sineOut',()=>{c.lift=0;dust(c.x+CW/2,c.y+CHh*.95,5);jolt=Math.max(jolt,2.5)});await wait(.12)}}
async function showNote(title,sub){const n=$('note');n.querySelector('.txt').textContent=title;n.querySelector('.sub').textContent=sub;n.style.zIndex=90;const y0=parseFloat(n.style.top);
 await tw(.55,(e,lin)=>{n.style.opacity=Math.min(1,lin*3);n.style.transform=`translate(0,${(1-e)*H*.6}px) rotate(${(1-e)*-12}deg) scale(${.9+.1*e})`},'swingOut');jolt=Math.max(jolt,3);dust(parseFloat(n.style.left)+n.clientWidth*.5,y0+n.clientHeight*.95,10)}
async function hideNote(){const n=$('note');await tw(.35,(e)=>{n.style.opacity=1-e;n.style.transform=`translate(0,${e*H*.5}px) rotate(${e*8}deg)`},'pow2In');n.style.transform=''}
async function sceneWin(){log('Победа: собран F-I-R-S-T');await fillRow(1);await wait(.3);await wave(1);await wait(.15);lampKick=.16;jolt=6;bounceMinis();hop('me');confetti(W*0.585,H*0.62,90);await wait(.6);await wave(1);await wait(.4);await showNote('ПОБЕДА','F · I · R · S · T собраны за 04:12');await wait(2.2);await hideNote()}
async function sceneLose(){log('Поражение: противник собрал набор');await fillRow(0);await wait(.3);await wave(0);hop('opp');
 // лампа приглушается, мои карты и рука тускнеют
 tween(.8,e=>{lampMul=1-.35*e},'sineOut');cards.filter(c=>c.side===1).forEach(c=>c.el.classList.add('dim'));await wait(.5);const my=cards.filter(c=>c.side===1&&c.where==='zone');for(const c of my){tween(.4,(e)=>{c.rot=(Math.random()*8-4)*e;c.y=c.y+3*e},'pow2In')}await wait(.8);
 await showNote('ПОРАЖЕНИЕ','Противник собрал набор первым');await wait(2.2);await hideNote();tween(.8,e=>{lampMul=.65+.35*e},'sineOut');cards.filter(c=>c.side===1).forEach(c=>c.el.classList.remove('dim'))}
async function sceneScreen(){log('Смена экрана: лампу выключили — стол убрали — лампу включили');const n=$('night');
 await tw(.4,e=>{n.style.opacity=e;lampMul=1-e},'sineIn'); // щёлк — темно, виден только огонёк лампы
 await wait(.7); layout(); $('log').textContent='';log('…в темноте стол убрали: это переход между экранами (партия → меню / новая партия)');
 await wait(.3); await tw(.6,e=>{n.style.opacity=1-e;lampMul=e},'sineOut');lampMul=1;lampKick=.14;jolt=1.5}
function reset(){layout();$('log').textContent='';}
document.querySelectorAll('.acts button').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;document.querySelectorAll('.acts button').forEach(x=>x.disabled=true);const a=b.dataset.act;try{if(a==='start'){reset();await wait(.2);await sceneStart()}if(a==='win')await sceneWin();if(a==='lose')await sceneLose();if(a==='screen')await sceneScreen();if(a==='reset')reset()}catch(e){log('ошибка: '+e.message);console.error(e)}busy=false;document.querySelectorAll('.acts button').forEach(x=>x.disabled=false)});
$('minb').onclick=()=>{const p=$('panel');p.classList.toggle('min');$('minb').textContent=p.classList.contains('min')?'+':'–'};
window.addEventListener('resize',layout);layout();
</script>
