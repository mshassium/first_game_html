 if(p.kind==='paper'){p.vy+=320*dt;p.vx*=.985;p.rot+=p.vr*dt;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,k*3);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore();continue}
 if(p.kind==='steam'){p.vx+=Math.sin(p.t*3)*4*dt;p.r+=6*dt;ctx.globalAlpha=.10*Math.sin(Math.min(1,p.t/p.life)*Math.PI)*lampMul;ctx.fillStyle='#e8dcc0';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();continue}
 p.vy+=(p.kind==='dust'?60:20)*dt;p.vx*=.98;ctx.globalAlpha=k*(p.kind==='dust'?.55:.9);ctx.fillStyle=p.color||'#cdb894';ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.kind==='dust'?2-k:k),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
// карты
function mkCard(letter,side,faceDown){const el=document.createElement('div');el.className='card';el.innerHTML='<div class="frost"></div>';el.style.width=CW+'px';el.style.height=CHh+'px';el.style.backgroundImage=`url(${faceDown?A.back:A[letter]})`;table.appendChild(el);const c={id:seq++,letter,side,el,x:0,y:0,rot:0,scale:1,lift:0,tiltY:0,phase:Math.random()*6.28,where:'hand',faceDown,busy:false};cards.push(c);return c}
function flip(c){c.faceDown=false;c.el.style.backgroundImage=`url(${A[c.letter]})`}
function hand(side){return cards.filter(c=>c.where==='hand'&&c.side===side).sort((a,b)=>a.hi-b.hi)}
function layoutHand(side,dur=.22){const hs=hand(side),n=hs.length,sc=L.hand[side].scale,step=Math.min(CW*sc*1.08,(W*.5)/Math.max(1,n));hs.forEach((c,i)=>{c.hi=i;const tx=L.hand[side].cx-((n-1)/2)*step+i*step-CW/2,ty=L.hand[side].y-CHh/2+(side?Math.abs(i-(n-1)/2)*4:0),tr=side?(i-(n-1)/2)*2.5:0;c.scale=sc;if(dur<=0){c.x=tx;c.y=ty;c.rot=tr;return}const{x:fx0,y:fy0,rot:fr}=c;tween(dur,p=>{c.x=fx0+(tx-fx0)*p;c.y=fy0+(ty-fy0)*p;c.rot=fr+(tr-fr)*p},'swingOut')})}
async function deal(side,letter){const c=mkCard(letter,side,true);c.x=L.deck[side].x;c.y=L.deck[side].y;c.where='flying';c.busy=true;c.hi=99;c.el.style.zIndex=60;const d=$('deck'+side);tween(.18,(e,lin)=>{d.style.transform=`scale(${1-.04*Math.sin(lin*Math.PI)})`},'sineOut',()=>d.style.transform='');const hs=hand(side).length,sc=L.hand[side].scale,step=Math.min(CW*sc*1.08,(W*.5)/(hs+1));const tx=L.hand[side].cx-(hs/2)*step+hs*step-CW/2,ty=L.hand[side].y-CHh/2;const sx=c.x,sy=c.y;let fl=false;
 await tw(.36,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e-Math.sin(lin*Math.PI)*60;c.scale=1+(sc-1)*e;if(side===1){c.tiltY=-180*(1-lin);if(lin>.5&&!fl){fl=true;flip(c)}}},'swingOut');c.tiltY=0;c.where='hand';c.busy=false;c.el.style.zIndex='';layoutHand(side);return c}
function freeZone(row){return zones.find(z=>z.row===row&&!z.card)}
async function playCard(c,zone){c.busy=true;c.el.style.zIndex=60;const sx=c.x,sy=c.y,sr=c.rot,s0=c.scale;zone.el.classList.add('target');c.where='flying';layoutHand(c.side);let flipped=!c.faceDown;
 await tw(.42*(c.side?1:1.2),(e,lin)=>{c.x=sx+(zone.x-sx)*e;c.y=sy+(zone.y-sy)*e-Math.sin(lin*Math.PI)*90;c.rot=sr*(1-e)+Math.sin(lin*Math.PI)*6;c.scale=s0+(1-s0)*e;c.lift=Math.sin(lin*Math.PI)*30;if(!flipped){c.tiltY=180*(1-lin);if(lin>.5){flipped=true;flip(c)}}},'swingOut');
 c.x=zone.x;c.y=zone.y;c.rot=0;c.scale=1;c.lift=0;c.tiltY=0;zone.el.classList.remove('target');zone.card=c;c.where='zone';c.zone=zone;tween(.26,(e,lin)=>{const k=Math.sin(lin*Math.PI);c.sx=1+.12*k;c.sy=1-.12*k},'pow2Out',()=>{c.sx=c.sy=1});jolt=Math.max(jolt,4);dust(zone.x+CW/2,zone.y+CHh*.95,12);lampKick=.05;await wait(.26);c.busy=false;c.el.style.zIndex=''}
async function slide(c,tx,ty,dur=.4,opts={}){c.busy=true;c.el.style.zIndex=90;const sx=c.x,sy=c.y,sr=c.rot,s0=c.scale;const ts=opts.scale??s0,trot=opts.rot??0;await tw(dur,(e,lin)=>{c.x=sx+(tx-sx)*e;c.y=sy+(ty-sy)*e;c.lift=Math.sin(lin*Math.PI)*18;c.scale=s0+(ts-s0)*e;c.rot=sr+(trot-sr)*e},opts.ease||'sineOut');c.lift=0;c.busy=false}
async function toTray(c,side){const T=L.tray[side];if(c.zone){c.zone.card=null;c.zone=null}c.where='flying';layoutHand(c.side);await slide(c,T.x+T.w/2-CW*.35,T.y+T.h/2-CHh*.35,.4,{scale:.7,rot:(Math.random()*24-12),ease:'pow2In'});c.where='tray';c.el.classList.add('dim');c.el.style.zIndex=20+seq;dust(c.x+CW*.35,c.y+CHh*.6,5)}
// предметы
function mkProp(kind,w,label){const el=document.createElement('div');el.className='prop';el.style.width=w+'px';el.style.height=w+'px';el.innerHTML=`<img src="${A[kind]}" alt="">`+(label?`<div class="lbl" style="--fs:${w*.28}px">${label}</div>`:'');table.appendChild(el);const p={el,kind,x:0,y:0,w,lift:0,rot:0,scale:1,alpha:1};props.push(p);return p}
function rmProp(p){p.el.remove();props.splice(props.indexOf(p),1)}
async function dropProp(p,x,y){p.x=x;p.y=y;p.lift=140;p.alpha=0;p.scale=1.25;await tw(.38,(e,lin)=>{p.lift=140*(1-e);p.alpha=Math.min(1,lin*4);p.scale=1.25-.25*e},'pow2In');jolt=Math.max(jolt,5);dust(x+p.w/2,y+p.w*.8,10);await tw(.18,(e,lin)=>{p.scale=1+.08*Math.sin(lin*Math.PI)},'linear')}
async function liftProp(p){await tw(.3,(e,lin)=>{p.lift=120*e;p.alpha=1-e;p.rot=15*e},'pow2In');rmProp(p)}
function hop(k){const m=minis[k];tw(.5,(e,lin)=>{m.lift=Math.sin(lin*Math.PI)*40},'sineOut').then(()=>{m.lift=0;dust(m.x+m.w/2,m.y+m.h*.9,10);jolt=Math.max(jolt,3)})}
function bounceMinis(){for(const k in minis){const m=minis[k];tween(.45,(e,lin)=>{m.lift=Math.max(0,Math.sin(lin*Math.PI*2))*4},'linear',()=>{m.lift=0})}}
// кубики
const FACE_ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
function mkDie(w,set){const el=document.createElement('div');el.className='die';el.style.width=el.style.height=w+'px';const cube=document.createElement('div');cube.className='cube';el.appendChild(cube);const faces={1:`rotateY(0deg) translateZ(${w/2}px)`,6:`rotateY(180deg) translateZ(${w/2}px)`,3:`rotateY(90deg) translateZ(${w/2}px)`,4:`rotateY(-90deg) translateZ(${w/2}px)`,2:`rotateX(90deg) translateZ(${w/2}px)`,5:`rotateX(-90deg) translateZ(${w/2}px)`};for(const n in faces){const f=document.createElement('div');f.className='f';f.style.backgroundImage=`url(${A[set+n]})`;f.style.transform=faces[n];cube.appendChild(f)}const sh=document.createElement('div');sh.className='dieShadow';sh.style.width=w*1.2+'px';sh.style.height=w*.7+'px';table.appendChild(sh);table.appendChild(el);const d={el,cube,sh,x:0,y:0,w,lift:0,rx:0,ry:0,alpha:1};dice.push(d);return d}
async function rollDie(d,x1,y1,face,dur,from){const w=d.w;const x0=W*0.98,y0=from==='top'?-w*2:H+w;d.x=x0;d.y=y0;d.alpha=1;const dist=x0-x1;const [fx,fy]=FACE_ROT[face];const rx0=fx-(3+Math.floor(Math.random()*2))*360,ry0=fy+(Math.random()<.5?1:-1)*360*(1+Math.floor(Math.random()*2));
 await tw(dur,(e,lin)=>{d.x=x0-dist*e;d.y=y0+(y1-y0)*E.pow2Out(lin);d.rx=rx0+(fx-rx0)*e;d.ry=ry0+(fy-ry0)*e;d.lift=Math.abs(Math.sin(lin*Math.PI*3))*w*1.6*(1-lin)*(1-lin);if(lin>.12&&Math.abs(Math.sin(lin*Math.PI*3))<.05&&Math.random()<.6)dust(d.x+w/2,d.y+w*.9,2)},'pow3Out');d.rx=fx;d.ry=fy;d.lift=0;dust(x1+w/2,y1+w*.9,8);jolt=Math.max(jolt,3)}
async function clearDice(){await Promise.all(dice.map((d,i)=>tw(.45+i*.06,(e,lin)=>{d.x=d.x+(W*1.05-d.x)*e;d.rx-=180*e;d.lift=Math.sin(lin*Math.PI)*20},'pow2In')));dice.splice(0).forEach(d=>{d.el.remove();d.sh.remove()})}
// UI
function uiEl(cls,style,html){const d=document.createElement('div');d.className=cls;for(const k in style){if(k.startsWith('--'))d.style.setProperty(k,style[k]);else d.style[k]=style[k]}d.innerHTML=html||'';table.appendChild(d);uiEls.push(d);return d}
function chip(label,value,x,y,d){return uiEl('ui chip',{left:x+'px',top:y+'px',width:d+'px',height:d+'px','--fs':(d*.34)+'px'},`<img src="${A.chip}" alt=""><span>${value}<small>${label}</small></span>`)}
function setChip(name,v){if(chips[name]&&chips[name].querySelector)chips[name].querySelector('span').childNodes[0].nodeValue=v}
function hud(){const d=CW*.55;chips.deck=chip('колода','45',L.deck[1].x+CW*1.2,L.deck[1].y+CHh*.55,d);chips.hand=null;chips.tray=null;
 const bd=CW*1.15,bx=W-bd-CW*.35,by=H*.72;uiEl('ui brass',{left:bx+'px',top:by+'px',width:bd+'px',height:bd+'px','--fs':(bd*.13)+'px'},`<img src="${A.endturn}" alt=""><span>Конец хода</span>`);
 const w=CW*.7,h=w*2.2;candleEl=uiEl('candle',{left:(L.deck[0].x+CW*1.35)+'px',top:(L.deck[0].y-CHh*.15)+'px',width:w+'px',height:h+'px','--img':'url('+A.candle+')','--h':h+'px'},'<div class="glow"></div><div class="l holder"></div><div class="l body"></div><div class="l flame"></div>');candleStart=performance.now()}
function menu(){const nw=Math.min(W*.34,H*.62),nx=L.cx-nw/2-CW*.9,ny=H*.5-nw/2;uiEl('ui',{left:nx+'px',top:ny+'px',width:nw+'px',height:nw+'px'},`<img src="${A.note}" alt="">`);
 ['F!RST','Продолжить','Играть','Игра по сети','Правила','Настройки'].forEach((t,i)=>{const e=uiEl('ui hand'+(i?' ring':''),{left:(nx+nw*.2)+'px',top:(ny+nw*(i?.26:.1)+Math.max(0,i-1)*nw*.115)+'px',width:nw*.56+'px',height:nw*.1+'px','--fs':(nw*(i?.06:.09))+'px'},`<span>${t}</span>`);if(i===1)e.style.opacity=.55});
 const bw=CW*1.5,bx=nx+nw+CW*.3,by=ny+nw*.18;uiEl('ui',{left:bx+'px',top:by+'px',width:bw+'px',height:bw*1.25+'px'},`<img src="${A.box}" alt="">`);uiEl('ui',{left:(bx-CW*.1)+'px',top:(by+bw*1.6)+'px',width:CW*.9+'px',height:CW*.9+'px'},`<img src="${A.d20}" alt="">`)}
function clearUi(){uiEls.splice(0).forEach(e=>e.remove());candleEl=null}
function cap(t){if(!$('cap_on').checked)return;const c=$('cap');c.textContent=t;c.classList.add('on');clearTimeout(cap.t);cap.t=setTimeout(()=>c.classList.remove('on'),2800*speed())}
async function showNote(title,sub){const n=$('note');n.querySelector('.txt').textContent=title;n.querySelector('.sub').textContent=sub;await tw(.55,(e,lin)=>{n.style.opacity=Math.min(1,lin*3);n.style.transform=`translate(0,${(1-e)*H*.6}px) rotate(${(1-e)*-12}deg)`},'swingOut');jolt=Math.max(jolt,3)}
async function hideNote(){const n=$('note');await tw(.35,e=>{n.style.opacity=1-e;n.style.transform=`translate(0,${e*H*.5}px) rotate(${e*8}deg)`},'pow2In');n.style.transform=''}
async function lampOn(){const n=$('night');await tw(.6,e=>{n.style.opacity=1-e;lampMul=e},'sineOut');lampMul=1;lampKick=.14;jolt=1.5}
async function lampOff(){const n=$('night');await tw(.4,e=>{n.style.opacity=e;lampMul=1-e},'sineIn')}
// ---------- сценарий ----------
async function sMenu(){cap('Лампу включили: на столе блокнот — это меню');menu();await lampOn();await wait(1.6);cap('Берём колоду из коробки — играть');await lampOff();clearUi();await wait(.3);await lampOn()}
async function sStart(){cap('Кубики решают, кто ходит первым');hud();const dw=CW*.34;const d0=mkDie(dw,'b'),d1=mkDie(dw,'g');const a=5,b=3;const r0=rollDie(d0,L.cx-CW*.4,H*.40-dw/2,a,1.45,'top');await wait(.25);const r1=rollDie(d1,L.cx+CW*.4,H*.52-dw/2,b,1.4,'bottom');await Promise.all([r0,r1]);await wait(.4);await tw(.35,(e,lin)=>{d0.lift=Math.sin(lin*Math.PI)*dw*.7},'sineOut');d0.lift=0;cap('Противник выбросил больше — часы к нему');await setTurn(0);await wait(.2);await clearDice();
 cap('Раздача: по пять карт');const me=['F','I','R','S','I'],op=['T','S','F','R','I'];for(let i=0;i<5;i++){deal(0,op[i]);await wait(.14);deal(1,me[i]);await wait(.14)}setChip('deck','40');await wait(.5)}
async function sTurns(){
 cap('Ход противника: он играет T — ставит капкан у твоей руки');let o=hand(0)[0];o.letter='T';await playCard(o,freeZone(0));const trap=mkProp('trap',CW*.9);const sk=L['socket_me1'];await dropProp(trap,sk.x,sk.y);await wait(.6);
 cap('Твой ход: капкан захлопывается — ты теряешь карту');await setTurn(1);await wait(.3);const victim=hand(1)[hand(1).length-1];trap.el.querySelector('img').src=A.trapc;jolt=6;dust(trap.x+trap.w/2,trap.y+trap.w*.8,10);await tw(.3,(e,lin)=>{trap.scale=1+.2*Math.sin(lin*Math.PI);victim.lift=26*Math.sin(lin*Math.PI)},'linear');victim.lift=0;await toTray(victim,1);setChip('tray','1');setChip('hand','4/7');await wait(.2);await liftProp(trap);
 cap('Ты играешь F: запрещаешь противнику S — замок и вымпел в его гнездо');let c=hand(1).find(k=>k.letter==='F');await playCard(c,freeZone(1));const lock=mkProp('lock',CW*.9);const so=L['socket_opp0'];await dropProp(lock,so.x,so.y);const pen=mkProp('pennant',CW*.7,'S');pen.x=so.x+CW*.6;pen.y=so.y-CW*.3;pen.alpha=0;await tw(.3,e=>{pen.alpha=e},'swingOut');snow(so.x+CW*.45,so.y+CW*.45,10);await wait(.8);
 cap('Ход противника: он играет S — но S под запретом');await setTurn(0);await wait(.3);o=hand(0)[0];o.letter='S';o.busy=true;o.el.style.zIndex=60;o.where='flying';layoutHand(0);const sx=o.x,sy=o.y,s0=o.scale;const mx=so.x+CW*1.25,my=so.y+CW*.45-CHh/2;let fl=false;await tw(.45,(e,lin)=>{o.x=sx+(mx-sx)*e;o.y=sy+(my-sy)*e-Math.sin(lin*Math.PI)*60;o.scale=s0+(1-s0)*e;o.tiltY=180*(1-lin);if(lin>.5&&!fl){fl=true;flip(o)}},'swingOut');o.tiltY=0;jolt=5;const frost=o.el.querySelector('.frost');await tw(.3,(e,lin)=>{o.rot=Math.sin(lin*Math.PI*10)*5*(1-lin);lock.scale=1+.15*Math.sin(lin*Math.PI)},'linear');o.rot=0;await tw(.4,e=>{frost.style.opacity=e},'sineOut');snow(mx+CW/2,my+CHh/2,14);cap('Запрет сработал: его карта уходит в сброс, замок снимается');await wait(.3);toTray(o,0);await liftProp(pen);await liftProp(lock);await wait(.5);
 cap('Твой ход: I — жетон на колоду, берёшь карту');await setTurn(1);await wait(.3);c=hand(1).find(k=>k.letter==='I');await playCard(c,freeZone(1));const tk=mkProp('tokI',CW*.85);await dropProp(tk,L.deck[1].x+CW*.07,L.deck[1].y+CHh*.3);await wait(.15);await deal(1,'T');setChip('deck','39');setChip('hand','4/7');await wait(.2);await liftProp(tk);await wait(.4);
 cap('Ход противника: R — и снова твой');await setTurn(0);await wait(.3);o=hand(0)[0];o.letter='R';await playCard(o,freeZone(0));await wait(.5);await setTurn(1);
 cap('Ты играешь R, S и T — набор F·I·R·S·T почти собран');for(const l of ['R','S','T']){c=hand(1).find(k=>k.letter===l)||hand(1)[0];c.letter=l;flip(c);await playCard(c,freeZone(1));await wait(.25)}}
async function sWin(){cap('Собран F·I·R·S·T — победа!');const zs=zones.filter(z=>z.row===1);for(const z of zs){if(!z.card){const letters=['F','I','R','S','T'];const c=mkCard(letters[z.i],1,false);c.x=z.x;c.y=z.y;c.where='zone';z.card=c}}
 for(const z of zs){const c=z.card;tween(.36,(e,lin)=>{c.lift=Math.sin(lin*Math.PI)*28},'sineOut',()=>{c.lift=0;dust(c.x+CW/2,c.y+CHh*.95,5);jolt=Math.max(jolt,2.5)});await wait(.12)}await wait(.15);lampKick=.16;jolt=6;bounceMinis();hop('me');confetti(L.cx,H*.62,90);await wait(.8);await showNote('ПОБЕДА','F · I · R · S · T собраны за 03:48');await wait(2.5);await hideNote();cap('Лампу выключили — партия убрана');await lampOff();layout();clearUi();await wait(.5);menu();await lampOn()}
function reset(){layout();clearUi();$('night').style.opacity=1;lampMul=0;$('note').style.opacity=0;menu();lampOn()}
async function run(a){if(busy)return;busy=true;document.querySelectorAll('.acts button').forEach(b=>b.disabled=true);try{
 if(a==='all'){layout();clearUi();$('night').style.opacity=1;lampMul=0;await wait(.4);await sMenu();await sStart();await sTurns();await sWin()}
 if(a==='menu'){layout();clearUi();$('night').style.opacity=1;lampMul=0;await sMenu()}if(a==='start'){layout();clearUi();$('night').style.opacity=0;lampMul=1;await sStart()}if(a==='turns'){if(!hand(1).length){layout();clearUi();$('night').style.opacity=0;lampMul=1;hud();for(const l of ['F','I','R','S','I'])deal(1,l);for(const l of ['T','S','F','R','I'])deal(0,l);await wait(.8)}await sTurns()}if(a==='win'){if(!cards.length){layout();clearUi();$('night').style.opacity=0;lampMul=1;hud()}await sWin()}if(a==='reset')reset()}catch(e){console.error(e)}busy=false;document.querySelectorAll('.acts button').forEach(b=>b.disabled=false)}
document.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>run(b.dataset.act));$('minb').onclick=()=>{const p=$('panel');p.classList.toggle('min');$('minb').textContent=p.classList.contains('min')?'+':'–'};
window.addEventListener('resize',layout);layout();menu();setTimeout(()=>lampOn(),400);
</script>
