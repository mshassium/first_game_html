name: Десктопные сборки

# Запускается только вручную: сборка идёт на раннерах Windows и macOS, а их
# минуты в бесплатном тарифе считаются с множителем 2 и 10 соответственно.
# Вкладка Actions → «Десктопные сборки» → Run workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег релиза, к которому приклеить архивы (пусто — только артефакты)"
        required: false
        default: ""

permissions:
  contents: write

env:
  APP_NAME: FIRST
  MAIN_CLASS: com.first.game.lwjgl3.Lwjgl3LauncherKt

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            archive: FIRST-windows-x64.zip
          - os: macos-latest
            label: macOS (Apple Silicon)
            archive: FIRST-macos-arm64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия приложения
        shell: bash
        run: echo "APP_VERSION=$(grep '^appVersion=' gdx/gradle.properties | cut -d= -f2)" >> $GITHUB_ENV

      - name: Собрать jar со всеми ассетами
        shell: bash
        working-directory: gdx
        run: ./gradlew lwjgl3:jar

      # Иконка печётся тем же инструментом, что и для Android: в репозитории её
      # нет, а держать ещё и .ico с .icns незачем — они выводятся из неё.
      - name: Испечь иконку приложения
        shell: bash
        working-directory: gdx
        run: ./gradlew tools:bakeIcons

      - name: Иконка (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('assets_src/branding/app_icon_1024.png').save('app.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Иконка (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p app.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size assets_src/branding/app_icon_1024.png --out "app.iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size*2)) $((size*2)) assets_src/branding/app_icon_1024.png --out "app.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns app.iconset -o app.icns

      # app-image, а не установщик: игроку достаточно распаковать и запустить,
      # а неподписанный установщик системы встречают заметно неприветливее.
      - name: Упаковать приложение (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          jpackage --type app-image \
            --name "$APP_NAME" \
            --app-version "$APP_VERSION" \
            --input gdx/lwjgl3/build/libs \
            --main-jar "first-game-$APP_VERSION.jar" \
            --main-class "$MAIN_CLASS" \
            --icon app.ico \
            --dest dist

      - name: Упаковать приложение (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # -XstartOnFirstThread обязателен: без него LWJGL не поднимает окно на macOS.
          jpackage --type app-image \
            --name "$APP_NAME" \
            --app-version "$APP_VERSION" \
            --input gdx/lwjgl3/build/libs \
            --main-jar "first-game-$APP_VERSION.jar" \
            --main-class "$MAIN_CLASS" \
            --icon app.icns \
            --java-options -XstartOnFirstThread \
            --dest dist

      - name: Заархивировать (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:APP_NAME" -DestinationPath "${{ matrix.archive }}"

      - name: Заархивировать (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # ditto вместо zip: сохраняет права на исполняемый файл и структуру .app,
        # иначе распакованное приложение не запускается.
        run: ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "${{ matrix.archive }}"

      - name: Проверить, что архив собрался
        shell: bash
        run: ls -lh "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          retention-days: 30

      - name: Приклеить к релизу
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ matrix.archive }}
          draft: true
          body: |
            Десктопные сборки со встроенной Java: распаковать и запустить.

            macOS не подписан: при первом запуске правый клик по FIRST.app → «Открыть».
            Windows покажет предупреждение SmartScreen: «Подробнее» → «Выполнить в любом случае».
