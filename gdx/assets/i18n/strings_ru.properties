rules.title=Правила и карты
rules.goal.title=ЦЕЛЬ
rules.goal.body=Собери в своём SPACE все пять букв F, I, R, S, T в любом порядке — или пять карт одной буквы.
rules.turn.title=ХОД
rules.turn.body=Возьми карту, затем выложи ровно одну карту из руки в SPACE и выполни её эффект. Первый игрок не берёт карту в самый первый ход.
rules.cards.title=КАРТЫ
rules.card.F=FORBID — назови букву. Первая же попытка противника сыграть её отправит карту в его сброс, а эффект пропадёт.
rules.card.I=INCREASE — возьми ещё одну карту.
rules.card.R=RECOVER — верни одну карту из своего сброса в руку.
rules.card.S=STEAL — отправь одну карту из SPACE противника в его сброс.
rules.card.T=TRAP — противник сбросит карту в начале своего следующего хода.
rules.limits.title=ВАЖНО
rules.limits.body=В руке не больше 7 карт, лишние уходят в сброс автоматически. Если колода пуста в момент обязательного добора — поражение. Какая именно буква запрещена тебе, не показывается: виден только сам факт запрета.
