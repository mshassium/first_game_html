rules.title=Rules & Cards
rules.goal.title=GOAL
rules.goal.body=Collect all five letters F, I, R, S, T in your SPACE - in any order - or five cards of the same letter.
rules.turn.title=YOUR TURN
rules.turn.body=Draw a card, then play exactly one card from hand into SPACE and resolve its effect. The first player skips the draw on the very first turn.
rules.cards.title=CARDS
rules.card.F=FORBID - name a letter. The first time the opponent tries to play it, the card goes to their discard and the effect is lost. The ban rides on the F card itself: while it sits in SPACE, a banner hangs beside it.
rules.card.I=INCREASE - draw one extra card.
rules.card.R=RECOVER - return one card from your discard to your hand.
rules.card.S=STEAL - send one card from the opponent's SPACE to their discard. Take their last F and the ban it holds falls with it.
rules.card.T=TRAP - the opponent discards one card at the start of their next turn.
rules.limits.title=IMPORTANT
rules.limits.body=Hand limit is 7 cards; the excess is discarded automatically. If your deck is empty when you must draw, you lose. You never see which letter is forbidden to you - only that a ban is active.

