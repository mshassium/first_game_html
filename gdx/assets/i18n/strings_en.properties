rules.title=Rules & Cards
rules.goal.title=GOAL
rules.goal.body=Put all five letters - F, I, R, S, T - into your SPACE. Order does not matter. Five cards of one letter also wins.
rules.turn.title=YOUR TURN
rules.turn.body=Draw a card from the deck. Play one card from your hand into your SPACE and resolve its effect at once. Whoever goes first skips the draw on their first turn.
rules.cards.title=CARDS
rules.card.F=FORBID - name any letter. If the opponent tries to play it, the card goes to their discard and its effect does not happen. The ban holds while your F card stays in your SPACE: a banner hangs on it.
rules.card.I=INCREASE - draw one more card from the deck.
rules.card.R=RECOVER - take one card from your discard back into your hand.
rules.card.S=STEAL - send any card from the opponent's SPACE to their discard. If it was their last F, their ban ends.
rules.card.T=TRAP - at the start of their next turn the opponent discards one card.
rules.limits.title=IMPORTANT
rules.limits.body=Your hand holds at most 7 cards - anything above that goes straight to the discard. If the deck runs out and you cannot draw, you lose. You never see the letter forbidden to you: the opponent's banner shows a question mark instead.

